<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Manon Cortot · Vidéaste, monteuse et photographe</title>
<meta name="description" content="Portfolio de Manon Cortot : courts-métrages, documentaire, photographie, communication et maquettes Figma.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Pinyon+Script&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --encre:#12224A; --pervenche:#8396C0; --ciel:#C6D8EE; --papier:#FAF5EF; --beurre:#FFF4D2; --soleil:#F6DA7A; --lavande:#B7B9F2;
  --bg:#F6F2EE; --texte:var(--encre); --texte-doux:#46557c;
  --verre:rgba(255,255,255,.46); --verre-fort:rgba(255,255,255,.7); --verre-bord:rgba(255,255,255,.75);
  --ombre:0 24px 60px -24px rgba(18,34,74,.38), 0 2px 6px -2px rgba(18,34,74,.08);
  --ombre-forte:0 40px 90px -30px rgba(18,34,74,.55);
  --display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --script:"Pinyon Script","Snell Roundhand","Brush Script MT",cursive;
  --sans:"Instrument Sans","Helvetica Neue",Arial,sans-serif;
  --courbe:cubic-bezier(.2,.8,.2,1);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0B1430; --texte:#F4EFE9; --texte-doux:#C6D8EE;
  --verre:rgba(255,255,255,.07); --verre-fort:rgba(255,255,255,.12); --verre-bord:rgba(255,255,255,.16);
  --ombre:0 24px 60px -24px rgba(0,0,0,.7);
}}
:root[data-theme="dark"]{--bg:#0B1430;--texte:#F4EFE9;--texte-doux:#C6D8EE;--verre:rgba(255,255,255,.07);--verre-fort:rgba(255,255,255,.12);--verre-bord:rgba(255,255,255,.16);--ombre:0 24px 60px -24px rgba(0,0,0,.7)}
*,*::before,*::after{box-sizing:inherit}
html{scroll-behavior:smooth;scroll-padding-top:calc(env(safe-area-inset-top,0px) + 90px)}
html,body{overflow-x:clip}
body{margin:0;background:var(--bg);color:var(--texte);font-family:var(--sans);font-size:17px;line-height:1.6;overflow-x:hidden}
img{max-width:100%;display:block}
a{color:inherit}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--soleil);outline-offset:3px;border-radius:8px}
.wrap{width:min(1200px,100% - 40px);margin-inline:auto;position:relative;z-index:1}
@media (prefers-reduced-motion: reduce){html{scroll-behavior:auto}*{animation:none!important;transition:none!important}}

/* ---------- Auras de fond ---------- */
.auras{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.aura{position:absolute;border-radius:50%;filter:blur(90px);opacity:.55;animation:derive 26s ease-in-out infinite alternate}
.aura.a1{width:46vw;height:46vw;left:-12vw;top:-10vw;background:var(--soleil)}
.aura.a2{width:52vw;height:52vw;right:-16vw;top:18vh;background:var(--lavande);animation-duration:32s;animation-delay:-8s}
.aura.a3{width:40vw;height:40vw;left:20vw;bottom:-18vw;background:var(--ciel);animation-duration:22s;animation-delay:-4s}
@keyframes derive{0%{transform:translate(0,0) scale(1)}50%{transform:translate(6vw,4vh) scale(1.12)}100%{transform:translate(-4vw,8vh) scale(.95)}}
.lueur{position:fixed;z-index:0;width:520px;height:520px;margin:-260px 0 0 -260px;border-radius:50%;pointer-events:none;
  background:radial-gradient(circle,rgba(246,218,122,.35),rgba(183,185,242,.18) 45%,transparent 70%);transition:opacity .4s;opacity:0;left:0;top:0}
@media (hover:hover) and (pointer:fine){.lueur{opacity:1}}
.grain{position:fixed;inset:0;z-index:100;pointer-events:none;opacity:.14;mix-blend-mode:multiply;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .3  0 0 0 0 .3  0 0 0 0 .35  0 0 0 .55 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}

/* ---------- Verre ---------- */
.verre{background:var(--verre);-webkit-backdrop-filter:blur(18px) saturate(1.5);backdrop-filter:blur(18px) saturate(1.5);
  border:1px solid var(--verre-bord);box-shadow:var(--ombre),inset 0 1px 0 rgba(255,255,255,.55);border-radius:26px}
.sombre .verre{background:rgba(255,255,255,.07);border-color:rgba(255,255,255,.14);box-shadow:0 30px 70px -30px rgba(0,0,0,.7),inset 0 1px 0 rgba(255,255,255,.12)}
.reflet{position:relative;overflow:hidden}
.reflet::after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;pointer-events:none;
  background:linear-gradient(100deg,transparent,rgba(255,255,255,.55),transparent);transform:skewX(-20deg);transition:left .8s var(--courbe)}
.reflet:hover::after{left:130%}

/* ---------- Boutons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;cursor:pointer;text-decoration:none;
  font:600 15px var(--sans);padding:13px 24px;border-radius:999px;color:var(--encre);
  background:linear-gradient(135deg,#FFF0B8,#F6DA7A 55%,#EFC55A);box-shadow:0 14px 30px -12px rgba(239,197,90,.95),inset 0 1px 0 rgba(255,255,255,.7);
  transition:transform .3s var(--courbe),box-shadow .3s}
.btn:hover{transform:translateY(-3px);box-shadow:0 20px 40px -14px rgba(239,197,90,1),inset 0 1px 0 rgba(255,255,255,.7)}
.btn:active{transform:translateY(0)}
.btn.verre-btn{background:var(--verre-fort);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border:1px solid var(--verre-bord);box-shadow:var(--ombre);color:var(--texte)}
.sombre .btn.verre-btn{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.2);color:var(--papier)}
.puce{display:inline-block;padding:6px 14px;border-radius:999px;font-size:14px;font-weight:600;background:var(--verre-fort);border:1px solid var(--verre-bord);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);cursor:default;
  --survol:var(--soleil);transition:transform .35s var(--courbe),background-color .3s,border-color .3s,color .3s,box-shadow .35s}
.sombre .puce{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.18)}
.puce:nth-child(4n+2){--survol:var(--lavande)}.puce:nth-child(4n+3){--survol:var(--ciel)}.puce:nth-child(4n+4){--survol:#F2C6B4}
.puce:hover{background:var(--survol);border-color:var(--survol);color:var(--encre);transform:translateY(-3px) rotate(-2deg);box-shadow:0 12px 22px -12px rgba(18,34,74,.5)}
.puce:nth-child(even):hover{transform:translateY(-3px) rotate(2deg)}
.puces-liste{display:flex;gap:8px;flex-wrap:wrap}
.pastilles{display:flex;gap:8px;flex-wrap:wrap}
.pastilles button{border:1px solid var(--verre-bord);background:var(--verre);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);
  padding:9px 18px;border-radius:999px;font-weight:600;font-size:15px;cursor:pointer;box-shadow:0 8px 20px -12px rgba(18,34,74,.4);transition:transform .25s var(--courbe),background .25s}
.pastilles button:hover{transform:translateY(-2px)}
.pastilles button[aria-pressed="true"],.pastilles button[aria-selected="true"]{background:var(--encre);color:var(--beurre);border-color:var(--encre)}
.sombre .pastilles button{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.18);color:var(--papier)}
.sombre .pastilles button[aria-pressed="true"]{background:var(--soleil);color:var(--encre);border-color:var(--soleil)}

/* ---------- Navigation ---------- */
.progression{position:fixed;left:0;top:0;height:3px;width:100%;z-index:70;background:linear-gradient(90deg,var(--soleil),var(--lavande));transform-origin:0 50%;transform:scaleX(0);pointer-events:none}
.nav{position:fixed;z-index:60;left:50%;top:calc(env(safe-area-inset-top,0px) + 14px);transform:translateX(-50%);width:min(1200px,100% - 24px);
  display:flex;align-items:center;justify-content:space-between;gap:14px;padding:8px 10px 8px 22px;border-radius:999px}
.logo{font-family:var(--script);font-size:30px;line-height:1;text-decoration:none;padding-top:4px;white-space:nowrap}
.nav ul{display:flex;gap:4px;list-style:none;margin:0;padding:0}
.nav ul a{display:block;text-decoration:none;font-weight:500;font-size:15px;padding:8px 14px;border-radius:999px;transition:background .25s}
.nav ul a:hover{background:rgba(255,255,255,.55)}
.nav ul a.actif{background:var(--encre);color:var(--beurre)}
.burger{display:none;border:0;background:var(--encre);color:var(--beurre);font-weight:600;border-radius:999px;padding:9px 16px;cursor:pointer}
@media (max-width:980px){
  .nav ul{position:absolute;top:calc(100% + 10px);left:0;right:0;flex-direction:column;padding:10px;border-radius:24px;display:none;
    background:var(--verre-fort);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);border:1px solid var(--verre-bord);box-shadow:var(--ombre)}
  .nav ul.ouvert{display:flex}
  .nav ul a{padding:12px 16px}
  .nav .btn{display:none}
  .burger{display:block}
}

/* ---------- Hero ---------- */
.hero{min-height:100vh;display:flex;align-items:center;padding:130px 0 70px;position:relative}
.hero .wrap{display:grid;grid-template-columns:1.05fr .95fr;gap:30px;align-items:center}
.hero .petit{font-family:var(--script);font-size:clamp(34px,4.2vw,56px);line-height:1;margin:0 0 -4px 6px;color:var(--pervenche)}
.hero h1{margin:0;font-family:var(--display);font-weight:900;text-transform:uppercase;line-height:.84;font-size:clamp(82px,13vw,190px);letter-spacing:-.01em}
.hero h1 span{display:block;will-change:transform}
.degrade{background:linear-gradient(100deg,var(--encre) 10%,#4A5EA0 45%,var(--pervenche) 80%);-webkit-background-clip:text;background-clip:text;color:transparent}
:root[data-theme="dark"] .degrade{background-image:linear-gradient(100deg,#FFF4D2,#F6DA7A 40%,#B7B9F2)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .degrade{background-image:linear-gradient(100deg,#FFF4D2,#F6DA7A 40%,#B7B9F2)}}
.hero h1 .contour{color:transparent;-webkit-text-stroke:2px var(--texte);background:none}
.hero .intro{max-width:31em;font-size:19px;margin:26px 0 30px;color:var(--texte-doux)}
.hero .actions{display:flex;gap:14px;flex-wrap:wrap}
.scene{position:relative;aspect-ratio:1/1;width:100%;max-width:580px;justify-self:center;container-type:inline-size}
.scene .orbe{position:absolute;inset:6% 2% 8% 6%;border-radius:50%;filter:blur(30px);opacity:.85;
  background:conic-gradient(from 200deg,var(--soleil),var(--lavande),var(--ciel),var(--soleil));animation:pulse 9s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
.dossier{position:absolute;left:0;width:74%;top:30%;bottom:6%}
.dossier .dos{position:absolute;inset:0;border-radius:3cqw 3cqw 2cqw 2cqw;background:linear-gradient(170deg,#EBD594,#D9BE72);box-shadow:var(--ombre-forte)}
.dossier .dos::before{content:"";position:absolute;top:-5cqw;left:6%;width:38%;height:6cqw;border-radius:2cqw 2cqw 0 0;background:#EBD594}
.dossier .feuille{position:absolute;left:7%;right:10%;top:-3cqw;height:55%;border-radius:1.2cqw;background:var(--papier);transform:rotate(-2deg);
  background-image:repeating-linear-gradient(0deg,transparent 0 2.6cqw,rgba(131,150,192,.35) 2.6cqw calc(2.6cqw + 1px));box-shadow:0 6px 18px -8px rgba(18,34,74,.3)}
.dossier .feuille.b{left:14%;right:4%;top:-1.5cqw;transform:rotate(3deg);background:var(--ciel);background-image:none}
.dossier .polaroid{position:absolute;z-index:2;left:3%;top:6%;width:44%;padding:2cqw 2cqw 6cqw;background:#fff;border-radius:1cqw;
  box-shadow:0 18px 40px -16px rgba(18,34,74,.55);transform:translateY(calc(var(--sortie,0) * -88%)) rotate(calc(var(--sortie,0) * -9deg));transform-origin:50% 100%}
.dossier .polaroid img{width:100%;aspect-ratio:1/1;object-fit:cover;object-position:50% 25%}
.dossier .polaroid span{position:absolute;left:0;right:0;bottom:1cqw;text-align:center;font-family:var(--script);font-size:5.2cqw;line-height:1.2;color:var(--encre)}
.dossier .face{position:absolute;z-index:3;left:0;right:0;bottom:0;top:22%;border-radius:2cqw;
  background:linear-gradient(175deg,#F7E7B0,#EED593);box-shadow:inset 0 1px 0 rgba(255,255,255,.7),0 -6px 20px -12px rgba(18,34,74,.35);
  display:flex;flex-direction:column;justify-content:flex-end;padding:0 0 7% 6%;color:var(--encre)}
.dossier .face .script{font-family:var(--script);font-size:9cqw;line-height:.8}
.dossier .face .gros{font-family:var(--display);font-weight:900;text-transform:uppercase;font-size:8.6cqw;line-height:.86;max-width:46cqw}
.dossier .face small{font-size:2.6cqw;opacity:.75;margin-top:1.5cqw}
.scene .moi{position:absolute;z-index:4;right:-3%;bottom:6%;height:92%;width:auto;max-width:none;pointer-events:none;
  filter:drop-shadow(0 30px 40px rgba(18,34,74,.35))}
@media (max-width:900px){.hero .wrap{grid-template-columns:1fr}.scene{max-width:460px;margin-top:10px}.hero{padding-top:110px;min-height:auto}}

/* bandeau */
.bandeau{position:relative;z-index:1;margin:0 auto;width:min(1200px,100% - 24px);border-radius:999px;overflow:hidden;padding:14px 0}
.bandeau .piste{display:flex;width:max-content;animation:defile 30s linear infinite}
.bandeau span{font-family:var(--display);font-weight:800;font-size:26px;text-transform:uppercase;padding-right:30px;white-space:nowrap}
.bandeau i{font-family:var(--script);font-style:normal;font-size:32px;padding-right:30px;color:var(--pervenche)}
@keyframes defile{to{transform:translateX(-50%)}}

/* ---------- Sections ---------- */
section{padding:120px 0;position:relative}
.titre{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;flex-wrap:wrap;margin-bottom:44px}
.titre h2{margin:0;font-family:var(--display);font-weight:900;text-transform:uppercase;font-size:clamp(58px,8.4vw,120px);line-height:.85}
.titre h2 em{display:block;font-family:var(--script);font-style:normal;text-transform:none;font-weight:400;font-size:.46em;line-height:1;margin-bottom:-2px;color:var(--pervenche);-webkit-text-fill-color:var(--pervenche)}
.titre p{max-width:29em;margin:0;color:var(--texte-doux)}

/* Vidéos : section sombre */
.sombre{background:radial-gradient(120% 80% at 10% 0%,#22356e 0%,#12224A 45%,#0a1430 100%);color:var(--papier);overflow:hidden}
.sombre .aura-locale{position:absolute;border-radius:50%;filter:blur(110px);opacity:.5;pointer-events:none;animation:derive 24s ease-in-out infinite alternate}
.sombre .titre h2 em{color:var(--soleil);-webkit-text-fill-color:var(--soleil)}
.sombre .titre p{color:var(--ciel)}
.sombre .degrade{background-image:linear-gradient(100deg,#FFF4D2,#F6DA7A 40%,#B7B9F2)}
.filtres{margin-bottom:34px}
.grille-affiches{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:26px}
.affiche{all:unset;cursor:pointer;display:block;position:relative;aspect-ratio:1/1.414;border-radius:18px;overflow:hidden;
  box-shadow:0 30px 50px -24px #000,0 0 0 1px rgba(255,255,255,.12);transition:transform .45s var(--courbe),box-shadow .45s}
.affiche img.fond{width:100%;height:100%;object-fit:cover}
.affiche:hover{box-shadow:0 40px 70px -24px #000,0 0 50px -10px rgba(246,218,122,.45),0 0 0 1px rgba(255,255,255,.25)}
.affiche .infos{position:absolute;left:10px;right:10px;bottom:10px;padding:12px 14px;border-radius:14px;transform:translateY(130%);transition:transform .45s var(--courbe)}
.affiche:hover .infos,.affiche:focus-visible .infos{transform:none}
.affiche .infos b{display:block;font-size:15px}
.affiche .infos small{opacity:.8}
.lecture{position:absolute;top:50%;left:50%;width:66px;height:66px;margin:-33px 0 0 -33px;border-radius:50%;display:grid;place-items:center;
  background:rgba(255,255,255,.22);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.5);opacity:0;transform:scale(.7);transition:.35s var(--courbe)}
.lecture::before{content:"";border-left:18px solid #fff;border-top:11px solid transparent;border-bottom:11px solid transparent;margin-left:5px}
.affiche:hover .lecture,.affiche:focus-visible .lecture,.format:hover .lecture,.format:focus-visible .lecture{opacity:1;transform:none}
.affiche .prix{position:absolute;top:14px;left:14px;z-index:2;padding:5px 12px;border-radius:999px;font-size:12px;font-weight:700;color:var(--encre);background:linear-gradient(135deg,#FFF0B8,#F6DA7A)}
.affiche.sans-image{padding:22px;display:flex;flex-direction:column;justify-content:flex-end}
.affiche.sans-image .fond{position:absolute;inset:0}
.affiche.sans-image .genre{position:relative;font-size:12px;font-weight:600;opacity:.85}
.affiche.sans-image h3{position:relative;margin:4px 0 0;font-family:var(--display);font-weight:900;text-transform:uppercase;font-size:44px;line-height:.86;overflow-wrap:anywhere}
.affiche.sans-image .sous{position:relative;font-family:var(--script);font-size:26px}
.style0 .fond,.format-texte.style0 .fond{background:radial-gradient(circle at 30% 20%,#FFF0B8,transparent 50%),conic-gradient(from 120deg at 70% 70%,#F6DA7A,#B7B9F2,#C6D8EE,#F6DA7A)}
.style0{color:var(--encre)}
.style1 .fond,.format-texte.style1 .fond{background:radial-gradient(circle at 70% 25%,#B7B9F2,transparent 55%),linear-gradient(160deg,#8396C0,#12224A)}
.style1{color:var(--papier)}
.style2 .fond,.format-texte.style2 .fond{background:radial-gradient(circle at 30% 80%,#F6DA7A,transparent 55%),linear-gradient(200deg,#C6D8EE,#8396C0)}
.style2{color:var(--encre)}
.sous-titre-grille{margin:60px 0 22px;font-family:var(--display);font-weight:800;text-transform:uppercase;font-size:34px;letter-spacing:.02em}
.grille-formats{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:24px}
.format{all:unset;cursor:pointer;display:block;position:relative;border-radius:18px;overflow:hidden;aspect-ratio:16/9;box-shadow:0 30px 50px -24px #000,0 0 0 1px rgba(255,255,255,.12);transition:transform .45s var(--courbe),box-shadow .45s}
.format img{width:100%;height:100%;object-fit:cover;transition:transform .8s var(--courbe)}
.format:hover img{transform:scale(1.05)}
.format:hover{transform:translateY(-6px);box-shadow:0 40px 70px -24px #000,0 0 50px -10px rgba(183,185,242,.5)}
.cache{display:none!important}
.legende-format{position:absolute;left:10px;right:10px;bottom:10px;padding:10px 14px;border-radius:14px;color:var(--papier);text-align:left;
  background:rgba(10,20,48,.45);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.18)}
.legende-format b{display:block;font-size:15px}.legende-format small{opacity:.8}
.format-texte{position:absolute;inset:0;padding:20px;display:flex;flex-direction:column;justify-content:flex-end;text-align:left}
.format-texte .fond{position:absolute;inset:0}
.format-texte > :not(.fond){position:relative}
.format-texte .genre{font-size:12px;font-weight:600;opacity:.85}
.format-texte h3{margin:2px 0 0;font-family:var(--display);font-weight:900;text-transform:uppercase;font-size:clamp(30px,4vw,42px);line-height:.9}
.format-texte .sous{font-family:var(--script);font-size:24px}
.plateforme{position:absolute!important;top:14px;right:14px;padding:5px 12px;border-radius:999px;font-size:12px;font-weight:700;color:#fff;background:linear-gradient(135deg,#f58529,#dd2a7b,#8134af)}
.chaine{margin-top:50px;display:flex;align-items:center;gap:18px;flex-wrap:wrap;padding:18px 22px}
.chaine p{margin:0;color:var(--ciel)}

/* ---------- Fenêtre ---------- */
dialog{border:0;padding:0;color:var(--encre);width:min(940px,100% - 28px);max-height:92vh;border-radius:28px;overflow:auto;
  background:rgba(250,245,239,.86);-webkit-backdrop-filter:blur(26px) saturate(1.4);backdrop-filter:blur(26px) saturate(1.4);
  box-shadow:0 50px 120px -30px rgba(0,0,0,.7),inset 0 1px 0 rgba(255,255,255,.7);border:1px solid rgba(255,255,255,.6)}
dialog::backdrop{background:rgba(10,18,40,.55);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
dialog[open]{animation:pop .45s var(--courbe)}
@keyframes pop{from{opacity:0;transform:translateY(30px) scale(.96)}}
.fermer{position:absolute;top:14px;right:14px;z-index:5;width:44px;height:44px;border-radius:50%;cursor:pointer;font:700 18px var(--sans);color:var(--encre);
  border:1px solid rgba(255,255,255,.7);background:rgba(255,255,255,.65);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);box-shadow:var(--ombre)}
.ecran{position:relative;aspect-ratio:16/9;background:#0a1430 center/cover;display:grid;place-items:center;text-align:center;color:var(--papier);overflow:hidden}
.ecran::before{content:"";position:absolute;inset:0;background:rgba(10,20,48,.55);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.ecran > *{position:relative}
.ecran iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.ecran .script{font-family:var(--script);font-size:42px;color:var(--soleil)}
.fiche{padding:30px 34px 36px}
.fiche h3{font-family:var(--display);font-weight:900;text-transform:uppercase;font-size:56px;line-height:.9;margin:0 0 6px}
.fiche .genre{color:#5d6d99;font-weight:600;margin:0 0 14px}
.fiche .puces-liste{margin:18px 0 24px}
.mode-photo{width:min(1150px,100% - 20px);background:rgba(10,20,48,.82);color:var(--papier)}
.mode-photo .ecran{aspect-ratio:auto;display:block;background:transparent}
.mode-photo .ecran::before{display:none}
.mode-photo .ecran img{width:100%;max-height:88vh;object-fit:contain;margin:auto}
.mode-photo .fiche{display:none}
.nav-photo{position:absolute!important;top:50%;margin-top:-26px;width:52px;height:52px;border-radius:50%;cursor:pointer;z-index:3;font:700 20px var(--sans);color:var(--encre);
  border:1px solid rgba(255,255,255,.7);background:rgba(255,255,255,.7);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.nav-photo.prec{left:14px}.nav-photo.suiv{right:14px}

/* ---------- Photos ---------- */
.series{margin-bottom:18px}
.texte-serie{max-width:46em;margin:0 0 30px;color:var(--texte-doux)}
/* mosaïque en grille (et non en colonnes CSS : dans les colonnes, Safari et Chrome
   font disparaître les photos qui s'animent au survol) */
.galerie{--ecart:16px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));grid-auto-rows:4px;column-gap:var(--ecart);align-items:start}
.galerie button{all:unset;display:block;cursor:zoom-in;border-radius:18px;overflow:hidden;position:relative;isolation:isolate;
  box-shadow:var(--ombre);transition:opacity .8s,transform .9s var(--courbe),box-shadow .4s}
.galerie button img{display:block;width:100%;height:auto;transition:transform .9s var(--courbe)}
.galerie button:hover img{transform:scale(1.05)}
.galerie button:hover{box-shadow:var(--ombre-forte)}
.galerie button.entre{opacity:0;transform:translateY(50px) scale(.97)}
@media (max-width:1040px){.galerie{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:780px){.galerie{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:620px){.galerie{--ecart:10px}.galerie button{border-radius:12px}}
.galerie.vide{grid-auto-rows:auto}
.galerie .bientot{aspect-ratio:3/4;border-radius:18px;border:2px dashed var(--pervenche);display:grid;place-items:center;text-align:center;padding:20px;color:var(--texte-doux)}
.galerie .bientot b{display:block;font:900 30px/.9 var(--display);text-transform:uppercase;color:var(--texte)}
.galerie .bientot span{font-family:var(--script);font-size:26px;color:var(--pervenche)}
@media (max-width:780px){.galerie .bientot:nth-child(3){display:none}.galerie .bientot{padding:10px}.galerie .bientot b{font-size:22px}.galerie .bientot span{font-size:19px}}
.outils{margin-top:34px;padding:18px 22px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.outils b{font-family:var(--display);font-size:22px;text-transform:uppercase;letter-spacing:.02em}

/* ---------- Graphisme ---------- */
.projets-com{padding:clamp(24px,4vw,48px)}
.panneau-com{display:none}
.panneau-com.actif{display:block;animation:glisse .55s var(--courbe)}
@keyframes glisse{from{opacity:0;transform:translateY(16px)}}
/* choix du projet : de grandes cartes avec aperçu */
.cartes-com{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;margin-bottom:26px}
.cartes-com button{all:unset;box-sizing:border-box;cursor:pointer;position:relative;display:flex;flex-direction:column;border-radius:22px;overflow:hidden;
  background:var(--verre);border:1px solid var(--verre-bord);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);box-shadow:0 14px 30px -18px rgba(18,34,74,.45);
  transition:transform .45s var(--courbe),box-shadow .45s,background .3s,border-color .3s}
.cartes-com .apercu{position:relative;aspect-ratio:16/9;overflow:hidden;background:var(--ciel)}
.cartes-com img{width:100%;height:100%;object-fit:cover;object-position:top;transition:transform .8s var(--courbe),filter .4s}
.cartes-com .num{position:absolute;top:12px;left:12px;padding:4px 11px;border-radius:999px;font:800 15px var(--display);letter-spacing:.06em;background:var(--verre-fort);color:var(--encre);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.cartes-com .legende{display:flex;align-items:center;gap:12px;padding:14px 18px 16px}
.cartes-com .legende span{flex:1;min-width:0}
.cartes-com b{display:block;font:900 clamp(24px,2.3vw,30px)/.95 var(--display);text-transform:uppercase}
.cartes-com small{display:block;margin-top:5px;font-size:14px;color:var(--texte-doux)}
.cartes-com .fleche{flex:none;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-size:17px;background:var(--verre-fort);border:1px solid var(--verre-bord);transition:transform .45s var(--courbe),background .3s,color .3s}
.cartes-com button:hover{transform:translateY(-6px);box-shadow:var(--ombre)}
.cartes-com button:hover img{transform:scale(1.06)}
.cartes-com button:hover .fleche{transform:translateX(4px)}
.cartes-com button:not([aria-selected="true"]) img{filter:saturate(.75)}
.cartes-com button[aria-selected="true"]{background:var(--encre);border-color:var(--encre);color:var(--beurre);box-shadow:0 22px 40px -18px rgba(18,34,74,.7)}
.cartes-com button[aria-selected="true"] small{color:var(--ciel)}
.cartes-com button[aria-selected="true"] .fleche{background:var(--soleil);border-color:var(--soleil);color:var(--encre);transform:rotate(90deg)}
.cartes-com button:focus-visible{outline:3px solid var(--soleil);outline-offset:3px}
@media (max-width:700px){.cartes-com{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;gap:12px;margin-inline:-16px;padding:4px 16px 14px;scrollbar-width:none}
  .cartes-com::-webkit-scrollbar{display:none}.cartes-com button{flex:0 0 74%;scroll-snap-align:center}.cartes-com .legende{padding:12px 14px 14px}}
/* le projet : titre et description à gauche, visuel à droite */
.com-grille{display:grid;grid-template-columns:minmax(260px,.75fr) 1.5fr;gap:44px 56px;align-items:start}
.com-grille > *{min-width:0}
.com-texte{position:sticky;top:110px}
.com-texte .texte{margin-top:22px}
.com-texte .texte p:first-child{margin-top:0}
.com-visuel > :first-child{margin-top:0}
@media (max-width:900px){.com-grille{grid-template-columns:1fr}.com-texte{position:static}}
.panneau-com h3,.maq h3{font-family:var(--display);font-weight:900;text-transform:uppercase;font-size:clamp(46px,5vw,74px);line-height:.88;margin:0;overflow-wrap:anywhere}
.script-titre{font-family:var(--script);font-size:32px;color:#5d6d99;margin:0 0 10px;line-height:1.1}
.panneau-com p,.maq p{margin:14px 0 0}
.panneau-com .puces-liste,.maq .puces-liste{margin-top:22px}
.mosaique{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));grid-auto-rows:210px;grid-auto-flow:dense;gap:14px;margin-top:40px}
.com-visuel .pc-scene,.com-visuel .livre-scene{margin-top:0}
.mosaique button{all:unset;cursor:zoom-in;border-radius:18px;overflow:hidden;box-shadow:var(--ombre);transition:transform .5s var(--courbe)}
.mosaique button:hover{transform:translateY(-6px) rotate(-1deg)}
.mosaique button:nth-child(1){grid-column:span 2;grid-row:span 2}
.mosaique.n2,.mosaique.n3{grid-template-columns:2fr 1fr;grid-auto-rows:240px}
.mosaique.n3 button:nth-child(1){grid-column:auto}.mosaique.n2 button:nth-child(1){grid-row:auto;grid-column:auto}.mosaique.n2{grid-auto-rows:380px;grid-template-columns:1fr 1fr}
.mosaique.n1{grid-template-columns:1fr;grid-auto-rows:auto}.mosaique.n1 button{grid-column:auto!important;grid-row:auto!important}
.mosaique img{width:100%;height:100%;object-fit:cover}
@media (max-width:820px){.mosaique,.mosaique.n2,.mosaique.n3{grid-template-columns:1fr 1fr;grid-auto-rows:150px;gap:10px}.mosaique button{border-radius:12px}}
/* site dans un ordinateur */
.pc-scene{margin-top:44px;perspective:2200px}
.pc{width:min(100%,940px);margin-inline:auto;transform:rotateX(9deg);transform-origin:50% 100%;transition:transform 1s var(--courbe)}
.pc:hover{transform:none}
.pc-ecran{position:relative;padding:2.2% 2.2% 2.6%;border-radius:22px 22px 0 0;background:linear-gradient(#20263a,#0d111c);box-shadow:inset 0 0 0 2px #3a4258,0 40px 80px -40px rgba(18,34,74,.7)}
.pc-ecran::before{content:"";position:absolute;top:.9%;left:50%;width:6px;height:6px;margin-left:-3px;border-radius:50%;background:#3b4560}
.pc-vue{position:relative;border-radius:6px;overflow:hidden;background:#fff;cursor:zoom-in}
.pc-barre{display:flex;align-items:center;gap:6px;height:28px;padding:0 12px;background:#ECE8E3;border-bottom:1px solid #d9d3cc}
.pc-barre i{width:10px;height:10px;border-radius:50%;background:#f26d5f}.pc-barre i:nth-child(2){background:#f6be4f}.pc-barre i:nth-child(3){background:#5fc454}
.pc-barre span{flex:1;max-width:340px;margin:0 auto;padding:2px 12px;border-radius:7px;background:#fff;font-size:12px;text-align:center;color:#555;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pc-diapo{position:relative;aspect-ratio:16/9}
.pc-diapo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:top;opacity:0;transform:scale(1.04);transition:opacity .8s ease,transform 6s ease-out}
.pc-diapo img.actif{opacity:1;transform:none}
.pc-socle{position:relative;height:clamp(12px,2vw,20px);margin:0 -7%;border-radius:0 0 18px 18px/0 0 100% 100%;background:linear-gradient(#d9dde6,#a9b0c0 70%,#8a91a3);box-shadow:0 30px 40px -24px rgba(18,34,74,.6)}
.pc-socle::before{content:"";position:absolute;top:0;left:50%;width:16%;height:45%;transform:translateX(-50%);border-radius:0 0 10px 10px;background:#bfc5d2}
.pc-pages{justify-content:center;margin-top:30px}
@media (max-width:620px){.pc{transform:none}.pc-ecran{border-radius:12px 12px 0 0}.pc-barre{height:20px}.pc-barre i{width:7px;height:7px}.pc-barre span{font-size:10px}}
/* livret feuilletable */
.livre-scene{margin-top:44px;perspective:2600px;user-select:none;-webkit-user-select:none}
.livre{position:relative;width:min(100%,1000px);aspect-ratio:1784/1256;margin-inline:auto;transform-style:preserve-3d;transition:transform .8s var(--courbe);touch-action:pan-y;cursor:grab;outline:none}
.livre:active{cursor:grabbing}
.livre:focus-visible{outline:3px solid var(--soleil);outline-offset:10px;border-radius:8px}
.livre.debut{transform:translateX(-25%)}
.livre.fin{transform:translateX(25%)}
.feuille{position:absolute;top:0;left:50%;width:50%;height:100%;transform-origin:left center;transform-style:preserve-3d;transition:transform 1s cubic-bezier(.3,.75,.2,1)}
.feuille.trainee{transition:none}
.face{position:absolute;inset:0;overflow:hidden;background:#E8DCC4;-webkit-backface-visibility:hidden;backface-visibility:hidden;box-shadow:0 30px 50px -28px rgba(18,34,74,.55)}
.face img{width:100%;height:100%;object-fit:cover;pointer-events:none;-webkit-user-drag:none}
.recto{border-radius:0 6px 6px 0}
.verso{transform:rotateY(180deg);border-radius:6px 0 0 6px}
.face::after{content:"";position:absolute;inset:0;pointer-events:none}
.recto::after{background:linear-gradient(90deg,rgba(0,0,0,.28),rgba(0,0,0,.06) 4%,transparent 12%),linear-gradient(270deg,rgba(255,255,255,.18),transparent 3%)}
.verso::after{background:linear-gradient(270deg,rgba(0,0,0,.28),rgba(0,0,0,.06) 4%,transparent 12%),linear-gradient(90deg,rgba(255,255,255,.18),transparent 3%)}
.livre-nav{display:flex;align-items:center;justify-content:center;gap:16px;margin-top:26px;flex-wrap:wrap}
.livre-nav button{all:unset;cursor:pointer;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-size:20px;background:var(--verre-fort);border:1px solid var(--verre-bord);box-shadow:var(--ombre);transition:transform .3s var(--courbe),opacity .3s}
.livre-nav button:hover{transform:translateY(-3px)}
.livre-nav button:disabled{opacity:.35;cursor:default;transform:none}
.livre-nav button:focus-visible{outline:3px solid var(--soleil);outline-offset:3px}
.livre-nav .compteur{min-width:9em;text-align:center;font-weight:600}
.livre-nav .agrandir{width:auto;padding:0 18px;border-radius:999px;font-size:15px;font-weight:600}
.livre-aide{text-align:center;margin:10px 0 0!important;font-size:14px;color:var(--texte-doux)}
@media (max-width:620px){.livre.debut,.livre.fin{transform:none}}

/* ---------- AE2I ---------- */
.ae2i{--rose:#C01182;--nuit:#0F1345;--creme:#F9EBAA;
  background:radial-gradient(90% 60% at 100% 0%,rgba(192,17,130,.55),transparent 60%),radial-gradient(70% 50% at 0% 100%,rgba(192,17,130,.35),transparent 60%),linear-gradient(170deg,#141a5a,#0F1345 50%,#0a0d33)}
.ae2i .titre h2 em{color:#F59AD0;-webkit-text-fill-color:#F59AD0}
.ae2i .degrade{background-image:linear-gradient(100deg,#FFF4D2,#F9EBAA 30%,#F59AD0 70%,#E04BAE)}
.ae2i .script-titre{color:#F59AD0}
.ae2i .puce:hover{color:var(--nuit)}
.ae-intro{display:grid;grid-template-columns:1.1fr .9fr;gap:24px 50px;align-items:end;margin:-14px 0 50px}
.ae-intro p{margin:0;font-size:19px;color:var(--ciel)}
.ae-roles{list-style:none;margin:0;padding:0;display:flex;gap:12px;flex-wrap:wrap}
.ae-roles li{flex:1 1 220px;padding:16px 18px 16px 62px;position:relative;border-radius:20px}
.ae-roles li::before{content:"0" counter(role);counter-increment:role;position:absolute;left:14px;top:14px;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;
  font:800 16px var(--display);color:var(--nuit);background:var(--creme)}
.ae-roles li:last-child::before{background:var(--rose);color:#fff}
.ae-roles{counter-reset:role}
.ae-roles b{display:block;font:900 24px/1 var(--display);text-transform:uppercase}
.ae-roles span{display:block;margin-top:6px;font-size:14px;color:var(--ciel)}
.ae-bloc{padding:clamp(22px,4vw,46px);margin-top:26px}
.ae-bloc .com-texte h3{font-family:var(--display);font-weight:900;text-transform:uppercase;font-size:clamp(42px,4.6vw,66px);line-height:.88;margin:0;overflow-wrap:anywhere}
.ae-bloc .texte p{margin:14px 0 0}.ae-bloc .com-texte .puces-liste{margin-top:20px}
.ae-num{display:inline-block;margin-bottom:12px;padding:4px 11px;border-radius:999px;font:800 15px var(--display);letter-spacing:.06em;background:var(--creme);color:var(--nuit)}
.ae-zoom{all:unset;cursor:zoom-in;display:block;border-radius:18px;overflow:hidden;box-shadow:0 30px 50px -24px #000;transition:transform .5s var(--courbe),box-shadow .5s}
.ae-zoom:hover{transform:translateY(-6px);box-shadow:0 40px 70px -24px #000,0 0 50px -10px rgba(192,17,130,.6)}
.ae-zoom:focus-visible{outline:3px solid var(--soleil);outline-offset:3px}
.ae-zoom img{width:100%;height:100%;object-fit:cover}
.ae-legende{display:block;margin-top:10px;font-size:14px;color:var(--ciel);text-align:center}
/* équipe */
.ae-equipe{transform:rotate(-1.2deg);padding:10px;background:#fff;border-radius:14px}
.ae-equipe img{border-radius:8px}
.ae-equipe:hover{transform:rotate(0) translateY(-6px)}
/* identité */
.ae-identite{display:grid;grid-template-columns:.9fr 1fr;gap:18px;align-items:start}
.ae-identite .charte{aspect-ratio:1414/2000}
.ae-logos{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.ae-logos > div:first-child{grid-column:1/-1}
.ae-logos .ae-zoom{aspect-ratio:1/1;position:relative}
.ae-logos > div:nth-child(2) .ae-zoom{transform:rotate(-3deg)}.ae-logos > div:nth-child(3) .ae-zoom{transform:rotate(3deg)}
.ae-logos > div .ae-zoom:hover{transform:rotate(0) translateY(-6px)}
.ae-logos > div:first-child .ae-zoom{aspect-ratio:16/10}
.ruban{position:absolute;top:12px;right:12px;padding:5px 12px 5px 30px;border-radius:999px;font-size:12px;font-weight:700;color:var(--rose);background:#fff}
.ruban::before{content:"";position:absolute;left:11px;top:50%;width:10px;height:14px;margin-top:-7px;border:3px solid #F48FC6;border-radius:50% 50% 0 0;transform:rotate(-20deg)}
/* réseaux : carrousel instagram + feed dans un téléphone */
.ae-reseaux{display:grid;grid-template-columns:1.25fr .75fr;gap:22px;align-items:center}
.post{max-width:460px;width:100%;justify-self:center;border-radius:20px;overflow:hidden;background:#fff;color:#111;box-shadow:0 40px 70px -30px #000}
.post-tete{display:flex;align-items:center;gap:10px;padding:10px 14px;font-size:14px;font-weight:600}
.post-tete img{width:32px;height:32px;border-radius:50%;object-fit:cover;box-shadow:0 0 0 2px #fff,0 0 0 4px var(--rose)}
.post-tete small{margin-left:auto;font-weight:500;color:#777}
.post-piste{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;aspect-ratio:4/5;position:relative}
.post-piste::-webkit-scrollbar{display:none}
.post-piste button{all:unset;flex:0 0 100%;scroll-snap-align:start;cursor:zoom-in}
.post-piste img{width:100%;height:100%;object-fit:cover}
.post-cadre{position:relative}
.post-fl{position:absolute;top:50%;margin-top:-17px;width:34px;height:34px;border-radius:50%;border:0;cursor:pointer;font:700 16px var(--sans);color:#111;background:rgba(255,255,255,.85);box-shadow:0 4px 12px rgba(0,0,0,.25);transition:opacity .3s}
.post-fl.prec{left:10px}.post-fl.suiv{right:10px}
.post-fl:disabled{opacity:0;pointer-events:none}
.post-compte{position:absolute;top:12px;right:12px;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:600;color:#fff;background:rgba(0,0,0,.55)}
.post-pied{display:flex;align-items:center;gap:12px;padding:10px 14px 14px}
.post-points{display:flex;gap:5px;margin:0 auto}
.post-points i{width:6px;height:6px;border-radius:50%;background:#cfcfcf;transition:background .3s,transform .3s}
.post-points i.actif{background:#3897f0;transform:scale(1.2)}
.post-onglets{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;padding:0 14px 16px}
.post-onglets button{border:1px solid #e3e3e3;background:#fafafa;color:#111;border-radius:999px;padding:5px 12px;font-size:13px;font-weight:600;cursor:pointer;transition:background .25s,color .25s}
.post-onglets button[aria-selected="true"]{background:var(--rose);border-color:var(--rose);color:#fff}
.tel{width:min(100%,250px);justify-self:center;padding:9px;border-radius:40px;background:#05071c;box-shadow:inset 0 0 0 2px #2a2f55,0 40px 70px -30px #000;transform:rotate(3deg);transition:transform .6s var(--courbe)}
.tel:hover{transform:rotate(0) translateY(-6px)}
.tel .ae-zoom{border-radius:32px;aspect-ratio:1170/2532;box-shadow:none}
.tel .ae-zoom:hover{transform:none}
.tel .ae-zoom img{object-position:top}
/* merch : les vêtements sortent du sac en faisant défiler */
.sac-scene{position:relative;width:min(100%,640px);margin-inline:auto;aspect-ratio:1/.9;container-type:inline-size}
.sac-scene .halo{position:absolute;left:10%;right:10%;top:12%;bottom:6%;border-radius:50%;filter:blur(40px);opacity:.6;background:conic-gradient(from 90deg,var(--rose),#3b2a9a,var(--creme),var(--rose))}
.chemise{position:absolute;left:19%;width:62%;bottom:3%;height:46%}
.chemise .dos-c{position:absolute;inset:0;border-radius:2.4cqw 2.4cqw 2cqw 2cqw;background:linear-gradient(170deg,#EBD594,#D9BE72);box-shadow:0 30px 50px -24px rgba(0,0,0,.7)}
.chemise .dos-c::before{content:"";position:absolute;top:-4.6cqw;left:7%;width:34%;height:5.6cqw;border-radius:2cqw 2cqw 0 0;background:#EBD594}

<div class="grain" aria-hidden="true"></div>
<div class="progression" aria-hidden="true"></div>

<nav class="nav verre" aria-label="Navigation principale">
  <a class="logo" href="#accueil" id="logo">Manon Cortot</a>
  <button class="burger" aria-expanded="false" aria-controls="menu">Menu</button>
  <ul id="menu">
    <li><a href="#videos">Vidéos</a></li>
    <li><a href="#photos">Photos</a></li>
    <li><a href="#ae2i">AE2I</a></li>
    <li><a href="#communication">Com & graphisme</a></li>
    <li><a href="#maquettes">Maquettes</a></li>
    <li><a href="#apropos">À propos</a></li>
    <li><a href="#contact">Contact</a></li>
  </ul>
  <a class="btn" href="#contact">Travailler ensemble</a>
</nav>

<main id="contenu"></main>

<dialog id="fenetre" aria-labelledby="fenetre-titre">
  <button class="fermer" aria-label="Fermer">✕</button>
  <div class="ecran" id="ecran"></div>
  <div class="fiche" id="fiche"></div>
</dialog>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
/* =====================================================================
   Ce site lit son contenu dans le dossier /content (fichiers .json).
   Ces fichiers sont modifiés depuis l'espace d'administration : /admin
   ===================================================================== */
window.__CONTENU__ = window.__CONTENU__ || null; /*__CONTENU_INTEGRE__*/

const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const reduit=matchMedia("(prefers-reduced-motion: reduce)").matches;
const esc=t=>String(t??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const paragraphes=t=>String(t||"").split(/\n\s*\n/).map(p=>p.trim()).filter(Boolean).map(p=>`<p>${esc(p).replace(/\n/g,"<br>")}</p>`).join("");
const ytId=u=>{const m=String(u||"").match(/(?:youtu\.be\/|v=|embed\/|shorts\/)([\w-]{11})/);return m?m[1]:null};
const liste=v=>Array.isArray(v)?v.filter(Boolean):[];

async function chargerContenu(){
  if(window.__CONTENU__) return window.__CONTENU__;
  const noms=["profil","videos","photos","graphisme","maquettes","zones"], c={};
  await Promise.all(noms.map(async n=>{const r=await fetch(`content/${n}.json`,{cache:"no-cache"});if(!r.ok)throw new Error(n);c[n]=await r.json()}));
  // contenus facultatifs : le site s'affiche même s'ils manquent
  await Promise.all(["ae2i"].map(async n=>{try{const r=await fetch(`content/${n}.json`,{cache:"no-cache"});if(r.ok)c[n]=await r.json()}catch{}}));
  // l'admin peut enregistrer « /images/… » : sur GitHub Pages le site est dans un sous-dossier, on retire la barre du début
  return JSON.parse(JSON.stringify(c),(k,v)=>typeof v==="string"&&v.startsWith("/images/")?v.slice(1):v);
}

chargerContenu().then(construire).catch(()=>{
  $("#contenu").innerHTML=`<div class="erreur verre"><h2>Le contenu n'a pas pu être chargé</h2><p>Ce site doit être ouvert depuis un hébergement (Netlify, GitHub Pages…) ou un petit serveur local : en double-cliquant simplement sur index.html, le navigateur bloque la lecture des fichiers du dossier content.</p></div>`;
  document.body.classList.remove("charge");
});

function construire(C){
  const P=C.profil, V=liste(C.videos.videos), S=liste(C.photos.series).filter(s=>s.nom),
        G=liste(C.graphisme.projets), M=liste(C.maquettes.maquettes), Z=C.zones||{}, O=P.options||{}, A=C.ae2i||null;
  $("#logo").textContent=`${P.prenom} ${P.nom}`;
  document.title=`${P.prenom} ${P.nom} · Vidéaste, monteuse et photographe`;

  const mots=liste(P.competences);
  $("#contenu").innerHTML=`
  <header class="hero" id="accueil">
    <div class="wrap">
      <div>
        <p class="petit">le portfolio de</p>
        <h1><span class="degrade">${esc(P.prenom)}</span><span class="contour">${esc(P.nom)}</span></h1>
        <p class="intro">${esc(P.accroche)}</p>
        <div class="actions"><a class="btn reflet" href="#videos">Voir mes films</a><a class="btn verre-btn" href="#photos">Mes photos</a></div>
      </div>
      <div class="scene" id="scene" aria-hidden="true">
        <div class="orbe"></div>
        <div class="dossier">
          <div class="dos"></div><div class="feuille"></div><div class="feuille b"></div>
          ${P.photo_accueil?`<div class="polaroid"><img src="${esc(P.photo_accueil)}" alt=""><span>c'est moi</span></div>`:""}
          <div class="face"><div class="script">Creative</div><div class="gros">Portfolio</div><small>Vidéo · Photo · Graphisme</small></div>
        </div>
        ${P.photo_decoupe?`<img class="moi" src="${esc(P.photo_decoupe)}" alt="">`:""}
      </div>
    </div>
  </header>
  ${mots.length?`<div class="bandeau verre" aria-hidden="true"><div class="piste" id="piste"></div></div>`:""}

  <section class="sombre" id="videos">
    <div class="aura-locale" style="width:520px;height:520px;left:-120px;top:-100px;background:#8396C0"></div>
    <div class="aura-locale" style="width:460px;height:460px;right:-120px;bottom:-60px;background:#F6DA7A;opacity:.25;animation-delay:-9s"></div>
    <div class="wrap">
      <div class="titre"><h2 class="degrade">Vidéos</h2></div>
      <div class="pastilles filtres" role="group" aria-label="Filtrer les vidéos" id="filtres"></div>
      <div class="grille-affiches" id="affiches"></div>
      <h3 class="sous-titre-grille" id="titre-formats">Vlogs & formats courts</h3>
      <div class="grille-formats" id="formats"></div>
      ${P.youtube?`<div class="chaine verre"><a class="btn reflet" href="${esc(P.youtube)}" target="_blank" rel="noopener">Ma chaîne YouTube</a><p>Tous mes projets en pleine qualité.</p></div>`:""}
    </div>
  </section>

  ${S.length?`<section id="photos">
    <div class="wrap">
      <div class="titre"><h2 class="degrade">Photos</h2></div>
      <div class="pastilles series" role="group" aria-label="Choisir une série" id="series"></div>
      <p class="texte-serie" id="texte-serie"></p>
      <div class="galerie" id="galerie"></div>
      ${liste(P.materiel).length?`<div class="outils verre"><b>Mes outils</b><div class="puces-liste">${liste(P.materiel).map(m=>`<span class="puce">${esc(m)}</span>`).join("")}</div></div>`:""}
    </div>
  </section>`:""}

  ${A?`<section class="sombre ae2i" id="ae2i">
    <div class="wrap">
      <div class="titre"><h2 class="degrade"><em>${esc(A.sous_titre)}</em>${esc(A.titre||"AE2I")}</h2></div>
      <div class="ae-intro">${A.intro?`<p>${esc(A.intro)}</p>`:"<div></div>"}
        ${liste(A.parcours).length?`<ol class="ae-roles">${liste(A.parcours).map(r=>`<li class="verre"><b>${esc(r.titre)}</b><span>${esc(r.texte)}</span></li>`).join("")}</ol>`:""}</div>
      <div id="ae-blocs"></div>
    </div>
  </section>`:""}

  ${G.length?`<section id="communication">
    <div class="wrap">
      <div class="titre"><h2 class="degrade">Com & graphisme</h2></div>
      <div class="cartes-com" role="tablist" aria-label="Projets" id="onglets-com"></div>
      <div class="projets-com verre" id="projets-com"></div>
    </div>
  </section>`:""}

  ${M.length?`<section id="maquettes">
    <div class="wrap">
      <div class="titre"><h2 class="degrade">Maquettes</h2></div>
      <div class="pastilles" role="tablist" id="maq-onglets" style="margin-bottom:30px"></div>
      <div id="maq-projets"></div>
    </div>
  </section>`:""}

  <section id="apropos">
    <div class="wrap">
      <div class="titre"><h2 class="degrade">À propos</h2></div>
      <div class="apropos-grille">
        ${P.photo_portrait?`<div class="portrait verre"><img src="${esc(P.photo_portrait)}" alt="Portrait de ${esc(P.prenom)} ${esc(P.nom)}"><div class="nom">${esc(P.prenom)}</div></div>`:"<div></div>"}
        <div>
          <div class="bio verre">${paragraphes(P.bio)}
            <div class="actions" style="display:flex;gap:12px;flex-wrap:wrap;margin-top:8px">${V.some(v=>v.categorie==="presentation")?`<button class="btn reflet" id="voir-cv">Voir mon CV vidéo</button>`:""}<a class="btn verre-btn" href="#contact">Me contacter</a></div>
            ${P.alternance?`<div class="alternance">${esc(P.alternance)}</div>`:""}
          </div>
          ${liste(P.distinctions).length?`<div class="prix-liste">${liste(P.distinctions).map(d=>`<div class="medaille verre reflet"><b>${esc(d.titre)}</b>${d.detail?`<small>${esc(d.detail)}</small>`:""}</div>`).join("")}</div>`:""}
          ${mots.length?`<div class="puces-liste competences">${mots.map(m=>`<span class="puce">${esc(m)}</span>`).join("")}</div>`:""}
        </div>
        ${liste(P.parcours).length?`<div class="labyrinthe"><svg class="trace" aria-hidden="true"></svg>
          <ol class="frise">${liste(P.parcours).map((e,i)=>`<li style="${placeMeandre(i,3,"3")};${placeMeandre(i,2,"2")}"><b>${esc(e.titre)}</b><span>${esc(e.texte)}</span></li>`).join("")}</ol></div>`:""}
      </div>
    </div>
  </section>

  <section id="contact">
    <div class="aura-locale" style="width:520px;height:520px;left:-140px;top:-120px;background:#4a64c4;opacity:.45"></div>
    <div class="aura-locale" style="width:460px;height:460px;right:-120px;bottom:-100px;background:#F6DA7A;opacity:.18;animation-delay:-9s"></div>
    <div class="wrap">
      <h2><em>un projet en tête ?</em>Parlons-en</h2>
      <p>Tournage, montage, shooting photo ou contenu pour les réseaux : écris-moi, je réponds vite.</p>
      <div class="liens">
        ${P.email?`<button class="btn" id="copier" data-label="Écris-moi">${esc(P.email)}</button>`:""}
        ${P.telephone?`<a class="btn" data-label="Appelle-moi" href="tel:${esc(P.telephone.replace(/\s/g,""))}">${esc(P.telephone)}</a>`:""}
        ${P.instagram?`<a class="btn" data-label="Suis-moi" href="${esc(P.instagram)}" target="_blank" rel="noopener">Instagram</a>`:""}
        ${P.youtube?`<a class="btn" data-label="Regarde" href="${esc(P.youtube)}" target="_blank" rel="noopener">YouTube</a>`:""}
      </div>
    </div>
  </section>
  <footer>${esc(P.prenom)} ${esc(P.nom)}, vidéaste et photographe · ${new Date().getFullYear()}</footer>`;

  /* --- bandeau --- */
  if($("#piste")){const b=mots.map((m,i)=>i%2?`<i>${esc(m)}</i>`:`<span>${esc(m)}</span>`).join("");$("#piste").innerHTML=b+b+b+b}

  /* --- menu mobile --- */
  $(".burger").onclick=e=>{const o=$("#menu").classList.toggle("ouvert");e.currentTarget.setAttribute("aria-expanded",o)};
  $$("#menu a").forEach(a=>a.addEventListener("click",()=>{$("#menu").classList.remove("ouvert");$(".burger").setAttribute("aria-expanded","false")}));
  const obsNav=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting)$$("#menu a").forEach(a=>a.classList.toggle("actif",a.getAttribute("href")==="#"+e.target.id))}),{rootMargin:"-45% 0px -50% 0px"});
  $$("section[id]").forEach(s=>obsNav.observe(s));

  /* --- fenêtre --- */
  const fen=$("#fenetre");
  $(".fermer").onclick=()=>fen.close();
  fen.addEventListener("click",e=>{if(e.target===fen)fen.close()});
  fen.addEventListener("close",()=>{$("#ecran").innerHTML="";$("#ecran").style.backgroundImage="";fen.classList.remove("mode-photo")});

  /* --- vidéos --- */
  const LIBELLES={court:"Courts-métrages",docu:"Documentaire",cine:"Cinematic",pub:"Pub & commande",vlog:"Vlogs",reseaux:"Réseaux sociaux",presentation:"Présentation"};
  const cats=[...new Set(V.map(v=>v.categorie).filter(Boolean))];
  $("#filtres").innerHTML=`<button aria-pressed="true" data-f="tous">Tout voir</button>`+cats.map(c=>`<button aria-pressed="false" data-f="${esc(c)}">${esc(LIBELLES[c]||c)}</button>`).join("");
  let n=0;
  const estInsta=u=>/instagram\.com/.test(u||"");
  V.forEach((v,i)=>{
    const enFormat=v.emplacement==="formats"||(!v.affiche&&v.miniature);
    const id=ytId(v.lien), mini=v.miniature||(id?`https://i.ytimg.com/vi/${id}/hqdefault.jpg`:"");
    const b=document.createElement("button");
    b.dataset.cat=v.categorie||""; b.setAttribute("aria-label",`${v.titre}, ${v.genre||""}. Ouvrir la fiche`);
    const carteTexte=cls=>`<div class="fond"></div><span class="genre">${esc(v.genre)}</span><h3>${esc(v.titre)}</h3>${v.sous_titre?`<span class="sous">${esc(v.sous_titre)}</span>`:""}`;
    if(enFormat){
      b.className="format";
      b.innerHTML=mini?`<img src="${esc(mini)}" alt="" loading="lazy"><div class="legende-format"><b>${esc(v.titre)}</b><small>${esc(v.genre)}</small></div><div class="lecture"></div>`
        :`<div class="format-texte style${n++%3}">${carteTexte()}${estInsta(v.lien)?`<span class="plateforme">Instagram</span>`:""}</div><div class="lecture"></div>`;
      const img=b.querySelector("img"); if(img) img.onerror=()=>{b.innerHTML=`<div class="format-texte style${i%3}">${carteTexte()}</div><div class="lecture"></div>`};
      $("#formats").appendChild(b);
    } else {
      b.className="affiche"+(v.affiche?"":" sans-image style"+(n++%3));
      b.innerHTML=v.affiche
        ?`<img class="fond" src="${esc(v.affiche)}" alt="" loading="lazy">${v.prix?`<span class="prix">${esc(v.prix)}</span>`:""}<div class="lecture"></div><div class="infos verre"><b>${esc(v.titre)}</b><small>${esc(v.genre)}</small></div>`
        :`${carteTexte()}${v.prix?`<span class="prix">${esc(v.prix)}</span>`:""}<div class="lecture"></div>`;
      $("#affiches").appendChild(b);
      if(!reduit){b.addEventListener("pointermove",e=>{if(e.pointerType!=="mouse")return;const r=b.getBoundingClientRect(),x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;
        b.style.transform=`perspective(900px) rotateY(${x*14}deg) rotateX(${-y*14}deg) translateY(-8px)`});b.addEventListener("pointerleave",()=>b.style.transform="")}
    }
    b.addEventListener("click",()=>ouvrirVideo(v,mini));
  });
  const majFormats=()=>$("#titre-formats").classList.toggle("cache",!$$("#formats .format:not(.cache)").length);
  majFormats();
  $$("#filtres button").forEach(btn=>btn.addEventListener("click",()=>{
    $$("#filtres button").forEach(x=>x.setAttribute("aria-pressed",x===btn));
    const f=btn.dataset.f; $$("#affiches > *, #formats > *").forEach(a=>a.classList.toggle("cache",f!=="tous"&&a.dataset.cat!==f)); majFormats();
  }));
  function ouvrirVideo(v,mini){
    const id=ytId(v.lien), insta=estInsta(v.lien), lien=v.lien||P.youtube||"#", ec=$("#ecran");
    const fond=v.miniature||v.affiche||mini||"";
    fen.classList.remove("mode-photo");
    ec.style.backgroundImage=fond?`url("${fond}")`:"";
    const plateforme=insta?"Instagram":"YouTube";
    ec.innerHTML=(O.youtube_integre&&id)
      ?`<iframe src="https://www.youtube-nocookie.com/embed/${id}?autoplay=1&rel=0" title="${esc(v.titre)}" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe>`
      :`<div style="padding:20px"><div class="script">${esc(v.sous_titre||v.genre)}</div><p style="margin:6px 0 18px">${v.lien?`La vidéo se regarde sur ${plateforme}.`:"Le lien de cette vidéo arrive bientôt."}</p><a class="btn reflet" href="${esc(lien)}" target="_blank" rel="noopener">${v.lien?`Regarder sur ${plateforme}`:"Voir ma chaîne YouTube"}</a></div>`;
    $("#fiche").innerHTML=`<h3 id="fenetre-titre">${esc(v.titre)}</h3><p class="genre">${esc(v.genre)}</p>${paragraphes(v.description)}
      <div class="puces-liste">${liste(v.roles).map(r=>`<span class="puce">${esc(r)}</span>`).join("")}${v.prix?`<span class="puce" style="background:linear-gradient(135deg,#FFF0B8,#F6DA7A)">${esc(v.prix)}</span>`:""}</div>
      ${v.lien?`<a class="btn verre-btn" href="${esc(v.lien)}" target="_blank" rel="noopener">Ouvrir sur ${plateforme}</a>`:""}`;
    fen.showModal();
  }
  if($("#voir-cv")) $("#voir-cv").onclick=()=>ouvrirVideo(V.find(v=>v.categorie==="presentation"));

  /* --- visionneuse photo commune --- */
  let lot=[], idx=0;
  function ouvrirPhoto(images,i){
    lot=images; idx=(i+lot.length)%lot.length; const im=lot[idx];
    fen.classList.add("mode-photo"); $("#ecran").style.backgroundImage="";
    $("#ecran").innerHTML=`<img src="${esc(im.image)}" alt="${esc(im.alt||"")}">${lot.length>1?`<button class="nav-photo prec" aria-label="Photo précédente">←</button><button class="nav-photo suiv" aria-label="Photo suivante">→</button>`:""}`;
    if(!reduit) $("#ecran img").animate([{opacity:0,transform:"scale(.97)"},{opacity:1,transform:"none"}],{duration:350,easing:"ease-out"});
    if(lot.length>1){$("#ecran .prec").onclick=()=>ouvrirPhoto(lot,idx-1);$("#ecran .suiv").onclick=()=>ouvrirPhoto(lot,idx+1)}
    $("#fiche").innerHTML=""; if(!fen.open) fen.showModal();
  }
  fen.addEventListener("keydown",e=>{if(!fen.classList.contains("mode-photo")||lot.length<2)return;if(e.key==="ArrowRight")ouvrirPhoto(lot,idx+1);if(e.key==="ArrowLeft")ouvrirPhoto(lot,idx-1)});

  /* --- photos --- */
  if(S.length){
    const obsGal=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){const b=e.target;b.classList.remove("entre");obsGal.unobserve(b);
      setTimeout(()=>b.style.transitionDelay="",1200)}}),{rootMargin:"0px 0px -8% 0px"});
    // chaque photo occupe autant de rangées de 4px que sa hauteur réelle (+ l'écart)
    const g=$("#galerie");
    const caler=b=>{const im=b.firstChild,w=b.offsetWidth;if(!w)return;const r=im.naturalWidth?im.naturalHeight/im.naturalWidth:4/3;
      b.style.gridRowEnd="span "+Math.ceil((w*r+parseFloat(getComputedStyle(g).columnGap))/4)};
    new ResizeObserver(()=>g.querySelectorAll("button").forEach(caler)).observe(g);
    // une photo peut être un simple chemin (ajout groupé dans l'admin) ou {image, alt}
    const photosDe=s=>liste(s.photos).map(ph=>typeof ph==="string"?{image:ph,alt:s.nom}:ph).filter(ph=>ph.image);
    const afficherSerie=s=>{
      const lot=photosDe(s);
      $("#texte-serie").textContent=s.description||""; g.innerHTML="";
      lot.forEach((ph,i)=>{const b=document.createElement("button");b.setAttribute("aria-label","Agrandir la photo "+(i+1));
        b.innerHTML=`<img src="${esc(ph.image)}" alt="${esc(ph.alt||"")}" loading="lazy">`;b.onclick=()=>ouvrirPhoto(lot,i);
        b.firstChild.addEventListener("load",()=>caler(b));
        if(!reduit){b.classList.add("entre");b.style.transitionDelay=(i%4)*90+"ms";obsGal.observe(b)} g.appendChild(b);caler(b)});
      g.classList.toggle("vide",!lot.length);
      if(!lot.length) g.innerHTML=[0,1,2].map(()=>`<div class="bientot"><div><b>Photos</b><span>bientôt en ligne</span></div></div>`).join("");
    };
    S.forEach((s,i)=>{const b=document.createElement("button");b.textContent=s.nom;b.setAttribute("aria-pressed",i===0);
      b.onclick=()=>{$$("#series button").forEach(x=>x.setAttribute("aria-pressed",x===b));afficherSerie(s)};$("#series").appendChild(b)});
    afficherSerie(S[0]);
  }

  /* --- communication & graphisme --- */
  G.forEach((g,i)=>{
    const imgs=liste(g.images).map(x=>typeof x==="string"?{image:x}:x), pages=liste(g.livret).map(x=>typeof x==="string"?x:x.page||x.image).filter(Boolean);
    const vignette=g.vignette||(imgs[0]||{}).image||pages[0]||(liste(g.site)[0]||{}).image;
    const t=document.createElement("button");t.setAttribute("role","tab");t.id="com-"+i;t.setAttribute("aria-controls","panneau-com-"+i);t.setAttribute("aria-selected",i===0);
    t.innerHTML=`<div class="apercu">${vignette?`<img src="${esc(vignette)}" alt="" loading="lazy">`:""}<span class="num">${String(i+1).padStart(2,"0")}</span></div>
      <div class="legende"><span><b>${esc(g.nom)}</b><small>${esc(g.sous_titre)}</small></span><i class="fleche" aria-hidden="true">→</i></div>`;
    t.onclick=()=>{$$("#onglets-com button").forEach((b,k)=>b.setAttribute("aria-selected",k===i));$$(".panneau-com").forEach((p,k)=>p.classList.toggle("actif",k===i));
      const r=$("#projets-com").getBoundingClientRect();if(r.top<0||r.top>innerHeight*.6)$("#projets-com").scrollIntoView({behavior:reduit?"auto":"smooth",block:"start"})};
    $("#onglets-com").appendChild(t);
    const d=document.createElement("div");d.className="panneau-com"+(i===0?" actif":"");d.id="panneau-com-"+i;d.setAttribute("role","tabpanel");d.setAttribute("aria-labelledby","com-"+i);
    d.innerHTML=`<div class="com-grille"><div class="com-texte"><p class="script-titre">${esc(g.sous_titre)}</p><h3>${esc(g.titre||g.nom)}</h3><div class="puces-liste">${liste(g.competences).map(c=>`<span class="puce">${esc(c)}</span>`).join("")}</div>
      <div class="texte">${paragraphes(g.description)}</div></div>
      <div class="com-visuel">${imgs.length?`<div class="mosaique n${Math.min(imgs.length,4)}">${imgs.map((im,k)=>`<button data-k="${k}" aria-label="Agrandir l'image ${k+1}"><img src="${esc(im.image)}" alt="${esc(im.alt||g.nom)}" loading="lazy"></button>`).join("")}</div>`:""}</div></div>`;
    d.querySelectorAll(".mosaique button").forEach(b=>b.onclick=()=>ouvrirPhoto(imgs,+b.dataset.k));
    const visuel=d.querySelector(".com-visuel");
    if(liste(g.site).length) visuel.appendChild(ordinateur(liste(g.site),g));

  /* --- AE2I : un bloc par projet, texte à gauche et visuel à droite --- */

    const R=A.reseaux;

        const cur=()=>Math.round(piste.scrollLeft/piste.clientWidth);

    // merch : les vêtements détourés sortent du dossier quand on fait défiler
    const MR=A.merch, pc=MR?liste(MR.pieces).map(img):[];
    if(pc.length){const n=pc.length, mil=(n-1)/2;
      const d=bloc(MR,`<div class="sac-scene" aria-label="Les pièces du merch, à agrandir">

      if(MR.logo) d.querySelector(".badge-wed").onclick=()=>ouvrirPhoto([{image:MR.logo,alt:MR.logo_nom||""}],0);
      const sc=d.querySelector(".sac-scene"), P_=[...sc.querySelectorAll(".piece")];
      const doux=t=>1-Math.pow(1-t,3);
      // les vêtements sortent une fois le dossier bien installé à l'écran (haut de la scène entre 62 % et 12 % de la hauteur)
      const sortie=()=>{const r=sc.getBoundingClientRect(), vh=innerHeight;
        let p=sc.dataset.survol?1:Math.max(0,Math.min(1,(vh*.62-r.top)/(vh*.62-vh*.12)));

      sc.addEventListener("pointerenter",e=>{if(e.pointerType==="mouse"){sc.dataset.survol=1;sortie()}});

      addEventListener("resize",sortie);sortie()}

    // vidéos : carrousel 3D de téléphones, celui du centre lit la vidéo directement sur le site
    const vids=liste(A.videos).filter(v=>v&&v.titre);
    const dv=bloc({titre:"Vidéos",sous_titre:"aftermovies & réels",description:vids.length?"":"Les vidéos que j'ai réalisées pour l'asso arrivent bientôt ici."},
      vids.length?`<div class="reels">
          <div class="reels-barres" aria-hidden="true">${vids.map(()=>"<i></i>").join("")}</div>

            ${vids.map((v,k)=>{const id=ytId(v.lien), mini=v.miniature||(id?`https://i.ytimg.com/vi/${id}/hqdefault.jpg`:"");
              return `<div class="reel-tel" data-k="${k}"><div class="reel-ecran">
                <button class="reel-affiche" aria-label="Regarder : ${esc(v.titre)}">${mini?`<img src="${esc(mini)}" alt="" loading="lazy" draggable="false">`:`<span class="reel-motif"></span>`}
                  <span class="reel-num">${String(k+1).padStart(2,"0")}</span><span class="reel-titre"><small>${esc(v.genre||"Vidéo")}</small>${esc(v.titre)}</span><span class="reel-play" aria-hidden="true"></span></button>
                <div class="reel-video"></div></div></div>`}).join("")}
            <button class="reels-fl prec" aria-label="Vidéo précédente">←</button><button class="reels-fl suiv" aria-label="Vidéo suivante">→</button>
          </div>

        </div>`
        :`<div class="ae-videos">${[0,1,2].map(()=>`<div class="bientot"><div><b>Vidéo</b><span>bientôt en ligne</span></div></div>`).join("")}</div>`);
    if(vids.length){
      dv.classList.add("bloc-reels");
      const igCode=u=>{const m=String(u||"").match(/instagram\.com\/(?:[\w.]+\/)?(?:reel|reels|p|tv)\/([\w-]+)/);return m?m[1]:null};
      const scene=dv.querySelector(".reels-scene"), tels=[...dv.querySelectorAll(".reel-tel")], barres=[...dv.querySelectorAll(".reels-barres i")], infos=dv.querySelector(".reels-infos");
      let cur=0, scriptIG=null, minuteur=null;
      const chargerIG=()=>{if(window.instgrm){instgrm.Embeds.process();return}
        if(scriptIG)return;scriptIG=document.createElement("script");scriptIG.async=true;scriptIG.src="https://www.instagram.com/embed.js";
        scriptIG.onload=()=>window.instgrm&&instgrm.Embeds.process();document.body.appendChild(scriptIG)};
      const lire=k=>{const v=vids[k], id=ytId(v.lien), ig=igCode(v.lien), zone=tels[k].querySelector(".reel-video");
        tels.forEach((t,j)=>{if(j!==k){t.classList.remove("lecture-on");t.querySelector(".reel-video").innerHTML=""}});
        if(id) zone.innerHTML=`<iframe src="https://www.youtube-nocookie.com/embed/${id}?autoplay=1&rel=0" title="${esc(v.titre)}" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe>`;
        else if(ig){const url=`https://www.instagram.com/reel/${ig}/`;zone.innerHTML=`<blockquote class="instagram-media" data-instgrm-permalink="${url}?utm_source=ig_embed" data-instgrm-version="14"><a href="${url}" target="_blank" rel="noopener">Chargement de la vidéo…</a></blockquote>`;chargerIG()}
        else return;

      const placer=()=>{const n=vids.length;
        tels.forEach((t,j)=>{const d=j-cur, a=Math.abs(d);
          t.style.setProperty("--d",d);t.style.setProperty("--a",a);t.style.zIndex=20-a;
          t.classList.toggle("actif",d===0);t.classList.toggle("loin",a>2);t.setAttribute("aria-hidden",d!==0);
