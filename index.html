        const v=vids[cur], ig=igCode(v.lien), url=ig?`https://www.instagram.com/reel/${ig}/`:(v.lien||"");
        infos.innerHTML=`<span class="reels-compteur">${String(cur+1).padStart(2,"0")} / ${String(n).padStart(2,"0")}</span>
          <h4>${esc(v.titre)}</h4><span class="reels-genre">${esc(v.genre||"Vidéo")}</span>${v.description?`<p>${esc(v.description)}</p>`:""}
          ${url?`<a class="btn verre-btn" href="${esc(url)}" target="_blank" rel="noopener">${ig?"Ouvrir sur Instagram":"Ouvrir sur YouTube"}</a>`:""}`;
        dv.querySelector(".reels-fl.prec").disabled=cur===0;dv.querySelector(".reels-fl.suiv").disabled=cur===n-1;
        // la vidéo du centre se charge toute seule une fois le téléphone en place
        clearTimeout(minuteur);tels.forEach((t,j)=>{if(j!==cur){t.classList.remove("lecture-on");t.querySelector(".reel-video").innerHTML=""}});
        if(scene.dataset.vu) minuteur=setTimeout(()=>lire(cur),650)};
      const aller=k=>{k=Math.max(0,Math.min(vids.length-1,k));if(k===cur)return;cur=k;placer()};
      tels.forEach((t,j)=>t.querySelector(".reel-affiche").onclick=()=>{if(j===cur)lire(j);else aller(j)});
      dv.querySelector(".reels-fl.prec").onclick=()=>aller(cur-1);dv.querySelector(".reels-fl.suiv").onclick=()=>aller(cur+1);
      scene.addEventListener("keydown",e=>{if(e.key==="ArrowRight"){e.preventDefault();aller(cur+1)}if(e.key==="ArrowLeft"){e.preventDefault();aller(cur-1)}});
      // glisser au doigt pour changer de vidéo
      let x0=null,y0=0;
      scene.addEventListener("touchstart",e=>{if(e.target.closest(".lecture-on .reel-video"))return;x0=e.touches[0].clientX;y0=e.touches[0].clientY},{passive:true});
      scene.addEventListener("touchend",e=>{if(x0===null)return;const dx=e.changedTouches[0].clientX-x0,dy=e.changedTouches[0].clientY-y0;x0=null;
        if(Math.abs(dx)>40&&Math.abs(dx)>Math.abs(dy))aller(cur+(dx<0?1:-1))},{passive:true});
      const obsV=new IntersectionObserver(es=>{if(es[0].isIntersecting){obsV.disconnect();scene.dataset.vu=1;lire(cur)}},{rootMargin:"200px 0px"});obsV.observe(scene);
      placer();
    }
  }

  /* --- site présenté dans un ordinateur, les pages défilent toutes seules --- */
  function ordinateur(ecr,g){
    const sc=document.createElement("div");sc.className="pc-scene";
    sc.innerHTML=`<div class="pc"><div class="pc-ecran"><div class="pc-vue" role="button" tabindex="0" aria-label="Agrandir la capture">
        <div class="pc-barre"><i></i><i></i><i></i><span>${esc(g.domaine||g.nom)}</span></div>
        <div class="pc-diapo">${ecr.map((e,k)=>`<img src="${esc(e.image)}" alt="${esc(g.nom)} : ${esc(e.nom||"")}" loading="lazy"${k?"":' class="actif"'}>`).join("")}</div></div></div>
      <div class="pc-socle"></div></div>
      ${ecr.length>1?`<div class="pastilles pc-pages" role="group" aria-label="Pages du site">${ecr.map((e,k)=>`<button aria-pressed="${!k}" data-k="${k}">${esc(e.nom||"Page "+(k+1))}</button>`).join("")}</div>`:""}`;
    const im=[...sc.querySelectorAll(".pc-diapo img")], bt=[...sc.querySelectorAll(".pc-pages button")];
    let k=0,survol=false,vu=false;
    const montrer=i=>{k=(i+ecr.length)%ecr.length;im.forEach((x,j)=>x.classList.toggle("actif",j===k));bt.forEach((b,j)=>b.setAttribute("aria-pressed",j===k))};
    bt.forEach(b=>b.onclick=()=>montrer(+b.dataset.k));
    const vue=sc.querySelector(".pc-vue"), zoom=()=>ouvrirPhoto(ecr.map(e=>({image:e.image,alt:`${g.nom} : ${e.nom||""}`})),k);
    vue.onclick=zoom;vue.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();zoom()}};
    sc.onmouseenter=()=>survol=true;sc.onmouseleave=()=>survol=false;
    new IntersectionObserver(es=>vu=es[0].isIntersecting).observe(sc);
    if(!reduit&&ecr.length>1) setInterval(()=>{if(vu&&!survol&&!document.hidden)montrer(k+1)},4500);
    return sc;
  }

  /* --- livret feuilletable : couverture seule à droite, puis doubles pages, on tourne en glissant --- */
  function livre(pages,nom){
    const n=Math.ceil(pages.length/2), sc=document.createElement("div");sc.className="livre-scene";
    const img=k=>pages[k]?`<img src="${esc(pages[k])}" alt="${esc(nom)}, page ${k+1}" loading="lazy" draggable="false">`:"";
    sc.innerHTML=`<div class="livre debut" tabindex="0" role="group" aria-roledescription="livret" aria-label="${esc(nom)} : utilise les flèches pour tourner les pages">
        ${Array.from({length:n},(_,i)=>`<div class="feuille"><div class="face recto">${img(2*i)}</div><div class="face verso">${img(2*i+1)}</div></div>`).join("")}</div>
      <div class="livre-nav"><button class="prec" aria-label="Page précédente">←</button><span class="compteur" aria-live="polite"></span><button class="suiv" aria-label="Page suivante">→</button><button class="agrandir">Agrandir</button></div>
      <p class="livre-aide">Glisse ou clique sur les pages pour les tourner</p>`;
    const L=sc.querySelector(".livre"), F=[...sc.querySelectorAll(".feuille")];
    let cur=0;
    const pose=(f,i,a)=>{f.style.transform=`translateZ(${(a<-90?i:n-i)*.4}px) rotateY(${a}deg)`;f.style.zIndex=a<-90?i+1:n-i};
    const maj=()=>{F.forEach((f,i)=>{f.classList.remove("trainee");pose(f,i,i<cur?-180:0)});
      L.classList.toggle("debut",cur===0);L.classList.toggle("fin",cur===n);
      sc.querySelector(".prec").disabled=cur===0;sc.querySelector(".suiv").disabled=cur===n;
      sc.querySelector(".compteur").textContent=cur===0?"Couverture":pages[2*cur]?`Pages ${2*cur}–${2*cur+1}`:`Page ${2*cur}`};
    const aller=c=>{cur=Math.max(0,Math.min(n,c));maj()};
    sc.querySelector(".prec").onclick=()=>aller(cur-1);sc.querySelector(".suiv").onclick=()=>aller(cur+1);
    sc.querySelector(".agrandir").onclick=()=>ouvrirPhoto(pages.map((p,k)=>({image:p,alt:`${nom}, page ${k+1}`})),cur?2*cur-1:0);
    L.addEventListener("keydown",e=>{if(e.key==="ArrowRight"){aller(cur+1);e.preventDefault()}if(e.key==="ArrowLeft"){aller(cur-1);e.preventDefault()}});
    // glisser : la feuille suit le doigt / la souris
    let x0=null,y0=0,sens=0,f=null,fi=0,p=0;
    L.addEventListener("pointerdown",e=>{if(e.button)return;x0=e.clientX;y0=e.clientY;sens=0;p=0;f=null});
    L.addEventListener("pointermove",e=>{if(x0===null)return;const dx=e.clientX-x0;
      if(!sens){if(Math.abs(dx)<8)return;if(Math.abs(e.clientY-y0)>Math.abs(dx)){x0=null;return}
        sens=dx<0?1:-1;fi=sens>0?cur:cur-1;f=F[fi];if(!f){x0=null;return}
        L.setPointerCapture(e.pointerId);f.classList.add("trainee");f.style.zIndex=n+5}
      const w=L.getBoundingClientRect().width*.5;p=Math.max(0,Math.min(1,(sens>0?-dx:dx)/(w*1.4)));
      f.style.transform=`translateZ(${n}px) rotateY(${sens>0?-180*p:-180+180*p}deg)`});
    const fin=e=>{if(x0===null)return;x0=null;
      if(!sens){const r=L.getBoundingClientRect();if(e.type==="pointerup")aller(e.clientX>r.left+r.width/2?cur+1:cur-1);return}
      if(p>.22)cur+=sens; maj()};
    L.addEventListener("pointerup",fin);L.addEventListener("pointercancel",fin);
    maj(); return sc;
  }

  /* --- maquettes --- */
  // Sur le site en ligne : la vraie maquette Figma (prototype cliquable) s'affiche dans le cadre.
  // Si Figma ne peut pas s'afficher (aperçu, hors ligne…), on bascule sur les captures d'écran.
  const protoUrl=m=>m.lien_prototype||String(m.lien_figma||"").replace("/design/","/proto/");
  const embed=u=>`https://www.figma.com/embed?embed_host=share&url=${encodeURIComponent(u)}`;
  let figmaBloque=!O.figma_en_direct;
  const maqs=[];
  M.forEach((m,i)=>{
    const ecrans=liste(m.ecrans); if(!ecrans.length&&!m.lien_figma) return;
    const t=document.createElement("button");t.setAttribute("role","tab");t.id="maq-ong-"+i;t.textContent=m.nom;t.setAttribute("aria-selected",maqs.length===0);
    $("#maq-onglets").appendChild(t);
    const d=document.createElement("div");d.className="maq"+(maqs.length===0?" actif":"");d.setAttribute("role","tabpanel");d.setAttribute("aria-labelledby","maq-ong-"+i);
    t.onclick=()=>{$$("#maq-onglets button").forEach(b=>b.setAttribute("aria-selected",b===t));$$(".maq").forEach(p=>p.classList.toggle("actif",p===d));if(!figmaBloque)d.chargerFigma()};
    d.innerHTML=`<div><p class="script-titre">${esc(m.sous_titre)}</p><h3>${esc(m.nom)}</h3>${paragraphes(m.description)}
      <div class="puces-liste">${liste(m.competences).map(c=>`<span class="puce">${esc(c)}</span>`).join("")}</div>
</div>
      <div class="navig"></div>`;
    $("#maq-projets").appendChild(d); maqs.push(d);
    const nav=d.querySelector(".navig");

    // ---- mode Figma en direct
    d.chargerFigma=()=>{ if(d.dataset.mode==="figma")return; d.dataset.mode="figma";
      nav.innerHTML=`<div class="appareil figma ${m.format==="mobile"?"mobile":"desktop"}">
          ${m.format!=="mobile"?`<div class="barre"><i></i><i></i><i></i><span class="url">${esc(m.domaine||"figma.com")}</span></div>`:""}
          <div class="vue"><iframe src="${embed(protoUrl(m))}" title="Prototype Figma ${esc(m.nom)}" allowfullscreen loading="lazy"></iframe></div>
        </div>
        <div class="pastilles mode" role="group" aria-label="Affichage">
          <button aria-pressed="true" data-v="proto">Prototype cliquable</button><button aria-pressed="false" data-v="design">Fichier complet</button>
        </div>`;
      nav.querySelectorAll("[data-v]").forEach(b=>b.onclick=()=>{nav.querySelectorAll("[data-v]").forEach(x=>x.setAttribute("aria-pressed",x===b));
        nav.querySelector("iframe").src=embed(b.dataset.v==="proto"?protoUrl(m):m.lien_figma)});
    };

    // ---- mode captures (repli)
    d.chargerCaptures=()=>{ if(d.dataset.mode==="captures")return; d.dataset.mode="captures";
      if(!ecrans.length){nav.innerHTML=`<p class="note-apercu verre">La maquette interactive s'affiche sur le site en ligne.</p>`;return}
      nav.innerHTML=`${O.apercu?`<p class="note-apercu verre">Aperçu : sur le site en ligne, c'est la vraie maquette Figma qui s'affiche ici.</p>`:""}
        <div class="appareil ${m.format==="mobile"?"mobile":"desktop"}">
          ${m.format!=="mobile"?`<div class="barre"><i></i><i></i><i></i><span class="url"></span></div>`:""}
          <div class="vue" tabindex="0" aria-label="Écran de la maquette ${esc(m.nom)}. Flèches gauche et droite pour changer d'écran."></div>
          <span class="indice">les boutons sont cliquables · fais défiler ↓</span>
        </div>
        <div class="controles">
          <button class="fl" data-dir="-1" aria-label="Écran précédent">←</button>
          <div class="pastilles" role="tablist" aria-label="Écrans de ${esc(m.nom)}">${ecrans.map((e,k)=>`<button role="tab" data-k="${k}">${esc(e.nom)}</button>`).join("")}</div>
          <button class="fl" data-dir="1" aria-label="Écran suivant">→</button>
        </div>`;
      const vue=nav.querySelector(".vue"), url=nav.querySelector(".url"), indice=nav.querySelector(".indice");
      let cur=0;
      function montrer(k,dir=1){
        cur=(k+ecrans.length)%ecrans.length;
        const e=ecrans[cur], zs=(Z[m.nom]||{})[e.nom];
        vue.innerHTML=`<div class="calque"><img src="${esc(e.image)}" alt="Écran ${esc(e.nom)} de la maquette ${esc(m.nom)}"></div>`; vue.scrollTop=0;
        const calque=vue.firstChild, img=calque.firstChild;
        const placer=()=>{indice.style.opacity=1; if(!zs) return; const L=zs.largeur, H=L*img.naturalHeight/img.naturalWidth;
          zs.zones.forEach(([x1,y1,x2,y2,c])=>{const a=document.createElement("button");a.className="zone";
            a.style.cssText=`left:${x1/L*100}%;top:${y1/H*100}%;width:${(x2-x1)/L*100}%;height:${(y2-y1)/H*100}%`;
            const cible=ecrans.findIndex(x=>x.nom===c);
            a.setAttribute("aria-label",String(c).startsWith("s:")?"Faire défiler la page":"Aller à l'écran "+c);
            a.onclick=ev=>{ev.stopPropagation();if(vue.dataset.tire==="1")return;
              if(String(c).startsWith("s:")) vue.scrollTo({top:(+c.slice(2))/H*img.offsetHeight-10,behavior:reduit?"auto":"smooth"});
              else if(cible>=0) montrer(cible,cible>=cur?1:-1)};
            calque.appendChild(a)})};
        img.complete&&img.naturalWidth?placer():img.addEventListener("load",placer,{once:true});
        calque.addEventListener("click",()=>{if(vue.dataset.tire==="1")return;calque.classList.remove("revele");void calque.offsetWidth;calque.classList.add("revele")});
        if(!reduit) calque.animate([{opacity:0,transform:`translateX(${dir*40}px)`},{opacity:1,transform:"none"}],{duration:420,easing:"cubic-bezier(.2,.8,.2,1)"});
        if(url) url.textContent=(m.domaine||"")+"/"+(e.chemin||"");
        nav.querySelectorAll("[data-k]").forEach((b,j)=>b.setAttribute("aria-selected",j===cur));
      }
      montrer(0);
      nav.querySelectorAll("[data-k]").forEach(b=>b.onclick=()=>montrer(+b.dataset.k,+b.dataset.k>=cur?1:-1));
      nav.querySelectorAll(".fl").forEach(b=>b.onclick=()=>montrer(cur+ +b.dataset.dir,+b.dataset.dir));
      vue.addEventListener("keydown",e=>{if(e.key==="ArrowRight"){e.preventDefault();montrer(cur+1,1)}if(e.key==="ArrowLeft"){e.preventDefault();montrer(cur-1,-1)}});
      vue.addEventListener("scroll",()=>{if(vue.scrollTop>20)indice.style.opacity=0},{passive:true});
      let y0,s0,tire=false;
      vue.addEventListener("pointerdown",e=>{if(e.pointerType!=="mouse")return;tire=true;vue.dataset.tire="0";y0=e.clientY;s0=vue.scrollTop});
      addEventListener("pointermove",e=>{if(!tire)return;if(Math.abs(e.clientY-y0)>5){vue.dataset.tire="1";vue.classList.add("tire")}vue.scrollTop=s0-(e.clientY-y0)});
      addEventListener("pointerup",()=>{if(!tire)return;tire=false;vue.classList.remove("tire");setTimeout(()=>vue.dataset.tire="0",0)});
    };
    if(figmaBloque||!m.lien_figma) d.chargerCaptures(); else if(maqs.length===1) d.chargerFigma();
  });
  // Si le navigateur ou l'hébergeur bloque Figma, on repasse sur les captures
  document.addEventListener("securitypolicyviolation",e=>{
    if(figmaBloque||!/figma\.com/.test(e.blockedURI||""))return; figmaBloque=true;
    maqs.forEach(d=>{delete d.dataset.mode;d.chargerCaptures()});
  });

  /* --- contact --- */
  const toast=m=>{const t=$("#toast");t.textContent=m;t.classList.add("visible");setTimeout(()=>t.classList.remove("visible"),2200)};
  if($("#copier")) $("#copier").onclick=async()=>{try{await navigator.clipboard.writeText(P.email);toast("Adresse copiée")}catch{location.href="mailto:"+P.email}};

  parcours();
  animations();
}

// Parcours en méandre : les lignes paires vont de gauche à droite, les impaires reviennent
function placeMeandre(i,n,k){const l=Math.floor(i/n),c=i%n;return `--l${k}:${l+1};--c${k}:${l%2?n-c:c+1}`}
function tracerParcours(){
  const ol=$(".frise"), svg=$(".trace"); if(!ol||!svg||getComputedStyle(svg).display==="none") return;
  const pts=$$(".frise li").map(li=>({x:li.offsetLeft+li.offsetWidth/2,y:li.offsetTop+18}));
  const W=ol.offsetWidth, r=28, bord=[16,W-16];
  let sens=1, d=`M ${bord[0]} ${pts[0].y} H ${pts[0].x}`;
  for(let i=1;i<pts.length;i++){const a=pts[i-1],b=pts[i];
    if(Math.abs(b.y-a.y)<4){d+=` H ${b.x}`;continue}
    const x=bord[sens>0?1:0], s=-sens;
    d+=` H ${x+s*r} Q ${x} ${a.y} ${x} ${a.y+r} V ${b.y-r} Q ${x} ${b.y} ${x+s*r} ${b.y} H ${b.x}`; sens=-sens}
  const fin=pts[pts.length-1], fx=fin.x+sens*60;
  svg.setAttribute("viewBox",`0 0 ${W} ${ol.offsetHeight}`);
  svg.innerHTML=`<defs><linearGradient id="trace-degrade" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="${ol.offsetHeight}">
    <stop offset="0" stop-color="var(--soleil)"/><stop offset=".5" stop-color="var(--lavande)"/><stop offset="1" stop-color="var(--pervenche)"/></linearGradient></defs>
    <path d="${d} H ${fx}" pathLength="1"/><circle cx="${bord[0]}" cy="${pts[0].y}" r="5"/><circle cx="${fx}" cy="${fin.y}" r="5"/>`;
}
function parcours(){
  const zone=$(".labyrinthe"); if(!zone) return;
  tracerParcours(); new ResizeObserver(tracerParcours).observe($(".frise"));
  if(reduit){zone.classList.add("trace-visible");return}
  const obs=new IntersectionObserver(es=>{if(es[0].isIntersecting){zone.classList.add("trace-visible");obs.disconnect()}},{rootMargin:"0px 0px -20% 0px"});
  obs.observe(zone);
}

function sortiePolaroid(){const sc=$("#scene");if(!sc)return;
  const r=sc.getBoundingClientRect(), vh=innerHeight;
  // 0 quand la scène est en place au chargement, 1 après environ 40 % d'écran de défilement
  const p=Math.max(0,Math.min(1,(scrollY+(sc.dataset.survol?vh*.4:0))/(vh*.4)));
  sc.style.setProperty("--sortie",p.toFixed(3));}
function animations(){
  const sc=$("#scene");
  if(sc){sc.addEventListener("pointerenter",()=>{sc.dataset.survol=1;sortiePolaroid()});sc.addEventListener("pointerleave",()=>{delete sc.dataset.survol;sortiePolaroid()})}
  if(reduit&&sc) sc.style.setProperty("--sortie",1);
  requestAnimationFrame(()=>setTimeout(()=>document.body.classList.remove("charge"),60));
  if(reduit) return;
  setTimeout(()=>document.body.classList.add("pret"),1800);
  const groupes=[[".titre h2",""],[".titre p",""],[".filtres",""],[".affiche","zoom"],[".format","zoom"],[".sous-titre-grille","gauche"],[".chaine",""],
    [".series",""],[".texte-serie",""],[".outils",""],[".onglets-com","gauche"],[".projets-com",""],[".ae-intro",""],[".ae-bloc",""],["#maq-onglets","gauche"],["#maq-projets",""],
    [".portrait","gauche"],[".bio",""],[".frise li",""],[".medaille","zoom"],[".competences",""],["#contact h2",""],["#contact p",""],[".liens .btn","zoom"],["footer",""]];
  const obs=new IntersectionObserver(es=>es.forEach(e=>{if(!e.isIntersecting)return;const el=e.target;obs.unobserve(el);el.classList.add("apparu");
    setTimeout(()=>{el.classList.remove("anim","apparu","gauche","zoom");el.style.transitionDelay=""},1500+(parseInt(el.style.transitionDelay)||0))}),{rootMargin:"0px 0px -10% 0px"});
  groupes.forEach(([sel,v])=>{const vus=new Map();$$(sel).forEach(el=>{const n=vus.get(el.parentNode)||0;vus.set(el.parentNode,n+1);
    el.classList.add("anim");if(v)el.classList.add(v);el.style.transitionDelay=Math.min(n,7)*80+"ms";obs.observe(el)})});
  // lueur qui suit la souris, parallaxe, barre de progression
  const lueur=$(".lueur"), barre=$(".progression"), spans=$$(".hero h1 span"), scene=$("#scene");
  let mx=innerWidth/2,my=innerHeight/2,lx=mx,ly=my;
  addEventListener("pointermove",e=>{mx=e.clientX;my=e.clientY},{passive:true});
  (function boucle(){lx+=(mx-lx)*.08;ly+=(my-ly)*.08;lueur.style.transform=`translate(${lx}px,${ly}px)`;
    if(scene&&scrollY<innerHeight){const dx=(mx/innerWidth-.5),dy=(my/innerHeight-.5);
      scene.querySelector(".orbe").style.translate=`${dx*-30}px ${dy*-30}px`;const moi=scene.querySelector(".moi");if(moi)moi.style.translate=`${dx*14}px ${dy*10}px`}
    requestAnimationFrame(boucle)})();
  let tic=false;
  addEventListener("scroll",()=>{if(tic)return;tic=true;requestAnimationFrame(()=>{const y=scrollY,max=document.documentElement.scrollHeight-innerHeight;
    barre.style.transform=`scaleX(${max>0?y/max:0})`;
    if(y<innerHeight*1.2){spans.forEach((s,i)=>s.style.setProperty("--px",(i%2?1:-1)*y*.12+"px"));if(scene)scene.style.transform=`translateY(${y*.12}px)`}
    sortiePolaroid();
    tic=false})},{passive:true});
}
