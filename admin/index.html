<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Administration · Portfolio de Manon Cortot</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Pinyon+Script&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="habillage.css">
</head>
<body>
  <!-- Espace d'administration (Sveltia CMS, compatible Decap CMS). Configuration : admin/config.yml -->
  <script src="cartes.js"></script>
  <script>
    // Sur manoncortot.fr, l'admin par mot de passe (gestion/) laisse une session à elle dans le navigateur :
    // on l'oublie ici pour que cet admin redemande bien la connexion GitHub.
    try { if (JSON.parse(localStorage.getItem('sveltia-cms.user'))?.token === 'session-gestion') localStorage.removeItem('sveltia-cms.user'); } catch {}
  </script>
  <script src="https://unpkg.com/@sveltia/cms/dist/sveltia-cms.js"></script>
</body>
</html>
