# =====================================================================
#  Configuration de l'espace d'administration du portfolio (Sveltia CMS)
#  Les couleurs et typos de l'admin sont dans admin/index.html.
# =====================================================================
backend:
  name: github
  repo: cortotmanon2171-web/Manon-Cortot-Portfolio
  branch: main

app_title: Admin · Manon Cortot
logo:
  src: https://manoncortot.fr/images/moi/accueil.jpg
  show_in_header: true
display_url: https://manoncortot.fr/
media_folder: images/uploads
public_folder: images/uploads
# noms de fichiers sans accents ni espaces pour les nouveaux projets (ex. « Planète Cacao » → planete-cacao.json)
slug:
  encoding: ascii
  clean_accents: true
editor:
  preview: false

# Chaque projet est rangé dans son propre fichier : l'admin les affiche en cartes avec leur image.
# Le robot .github/workflows/assembler-contenu.yml les rassemble ensuite dans content/videos.json, photos.json…
# que lit le site. Glisse les cartes (bouton « Réorganiser ») pour changer l'ordre d'affichage sur le site.
collections:

  # ---------------------------------------------------------- VIDÉOS
  - name: videos
    label: 🎬 Vidéos
    label_singular: vidéo
    description: "Tes films et formats courts. L'ordre des cartes est l'ordre d'affichage sur le site."
    folder: content/videos
    format: json
    extension: json
    create: true
    identifier_field: titre
    summary: "{{titre}}"
    thumbnail: [affiche, miniature]
    reorder: true
    # à l'ouverture, les vidéos sont rangées par catégorie (menu « Grouper par » pour changer)
    view_groups:
      default: categorie
      groups:
        - {name: categorie, label: Catégorie, field: categorie}
        - {name: emplacement, label: Emplacement, field: emplacement}
    fields:
      - {name: titre, label: Titre, widget: string}
      - {name: sous_titre, label: Sous-titre, widget: string, required: false, hint: "Petite ligne manuscrite sous le titre (ex. « rêve 327 »)"}
      - {name: genre, label: Genre, widget: string, hint: "Ex. Court-métrage, Documentaire, Vlog…"}
      - name: categorie
        label: Catégorie (pour les filtres)
        widget: relation
        collection: categories_videos
        value_field: "{{slug}}"
        search_fields: [nom]
        display_fields: [nom]
        required: false
        hint: "Les catégories se créent, se renomment et se rangent dans « 🏷️ Catégories de vidéos »."
      - name: emplacement
        label: Où l'afficher
        widget: select
        default: films
        options:
          - {label: "Grille des films (avec affiche)", value: films}
          - {label: "Vlogs & formats courts (format 16/9)", value: formats}
      - {name: affiche, label: Affiche (format portrait), widget: image, required: false, hint: "Pour la grille des films."}
      - {name: miniature, label: Miniature (format 16/9), widget: image, required: false, hint: "Facultatif : sans miniature, celle de YouTube est utilisée automatiquement."}
      - {name: lien, label: Lien de la vidéo (YouTube ou Instagram), widget: string, required: false, hint: "Ex. https://youtu.be/xxxxxxxxxxx ou un lien de réel Instagram"}
      - name: fichier
        label: "Fichier vidéo (envoyé depuis ton ordinateur)"
        widget: file
        required: false
        accept: "video/mp4,video/webm,.mp4,.webm"
        choose_url: false
        # GitHub refuse les gros fichiers et le site deviendrait lent : au-delà de 95 Mo (GitHub refuse plus de 100 Mo) l'admin bloque l'envoi
        # avec le message « Ce fichier ne peut pas être téléversé, car il dépasse la taille maximale ».
        media_libraries:
          default:
            config:
              max_file_size: 99614720
        hint: "Pour une vidéo qui n'est pas sur YouTube ou Instagram. MP4, 95 Mo maximum (GitHub refuse les fichiers plus gros). Si ta vidéo est trop lourde, exporte-la en 1080p ou 720p. Si tu mets aussi un lien, c'est le fichier qui est lu sur le site."
      - {name: roles, label: Mes rôles, widget: list, required: false, hint: "Sépare par des virgules, ex. Montage, Cadrage"}
      - {name: prix, label: Prix ou distinction, widget: string, required: false}
      - {name: description, label: Description, widget: text, hint: "Laisse une ligne vide pour faire un nouveau paragraphe."}

  # ---------------------------------------------------------- CATÉGORIES DE VIDÉOS
  # Une fiche par catégorie (content/categories-videos/court.json…) : son nom de fichier est le code que retiennent les vidéos,
  # il ne change pas quand on renomme la catégorie. Le robot les rassemble dans content/categories-videos.json.
  - name: categories_videos
    label: 🏷️ Catégories de vidéos
    label_singular: catégorie
    description: "Les filtres au-dessus de tes vidéos, dans l'ordre du site (bouton « Réorganiser » pour le changer). Une catégorie sans vidéo ne s'affiche pas sur le site."
    folder: content/categories-videos
    format: json
    extension: json
    create: true
    identifier_field: nom
    summary: "{{nom}}"
    reorder: true
    fields:
      - {name: nom, label: Nom du filtre, widget: string, hint: "Affiché sur le bouton au-dessus des vidéos, ex. « Courts-métrages ». Si tu supprimes une catégorie, ses vidéos restent visibles dans « Tout voir » : pense à leur en choisir une autre."}

  # ---------------------------------------------------------- PHOTOS
  - name: photos
    label: 📷 Photos
    label_singular: série
    description: "Tes séries de photos."
    folder: content/photos
    format: json
    extension: json
    create: true
    identifier_field: nom
    summary: "{{nom}}"
    thumbnail: ["photos.*"]
    reorder: true
    fields:
      - {name: nom, label: Nom de la série, widget: string}
      - {name: description, label: Texte de présentation, widget: text, required: false}
      - name: photos
        label: Photos
        widget: image
        multiple: true
        required: false
        # Les photos sortent de l'appareil à 20-25 Mo : l'admin les réduit avant l'envoi,
        # sinon l'enregistrement échoue (« Load failed ») et le site serait très lent.
        media_libraries:
          default:
            config:
              transformations:
                raster_image: {format: webp, quality: 85, width: 2000, height: 2000}
        hint: "Tu peux sélectionner ou déposer plusieurs photos d'un coup. Glisse-les pour changer l'ordre. Tant que la série est vide, des cadres « bientôt en ligne » s'affichent."

  # ---------------------------------------------------------- COM & GRAPHISME
  - name: graphisme
    label: 🎨 Com & graphisme
    label_singular: projet
    description: "Tes projets de communication et de graphisme."
    folder: content/graphisme
    format: json
    extension: json
    create: true
    identifier_field: nom
    summary: "{{nom}}"
    thumbnail: [vignette, "images.*", reseaux.feed, "livret.*", "site.*.image"]
    reorder: true
    fields:
      - {name: nom, label: Nom (onglet), widget: string}
      - {name: sous_titre, label: Sous-titre manuscrit, widget: string, required: false}
      - {name: titre, label: Grand titre, widget: string, required: false}
      - {name: description, label: Description, widget: text}
      - {name: competences, label: Compétences, widget: list, required: false}
      - {name: vignette, label: "Image de la carte du projet (sinon la première image)", widget: image, required: false}
      - {name: chiffres, label: "Chiffres clés (sous le texte)", widget: list, required: false, collapsed: true, summary: "{{fields.valeur}}", fields: [{name: valeur, label: Chiffre, widget: string}, {name: texte, label: Explication, widget: string}]}
      - {name: images, label: Images (galerie), widget: list, required: false, field: {name: image, label: Image, widget: image}}
      - {name: planches, label: "Rangées de visuels (avec un petit titre)", widget: list, required: false, collapsed: true, summary: "{{fields.titre}}", fields: [{name: titre, label: Titre, widget: string}, {name: texte, label: Petite phrase, widget: string, required: false}, {name: images, label: Visuels, widget: list, collapsed: true, thumbnail: image, summary: "{{fields.nom}}", fields: [{name: image, label: Image, widget: image}, {name: nom, label: "Petite étiquette sur l'image (facultatif)", widget: string, required: false}]}]}
      - {name: site, label: "Captures du site (affichées dans un ordinateur)", widget: list, required: false, collapsed: true, thumbnail: image, summary: "{{fields.nom}}", fields: [{name: nom, label: Nom de la page, widget: string}, {name: image, label: "Capture (format 16:9)", widget: image}]}
      - {name: domaine, label: Adresse affichée dans l'ordinateur, widget: string, required: false}
      - {name: livret, label: "Pages du livret feuilletable (dans l'ordre, couverture d'abord)", widget: list, required: false, field: {name: page, label: Page, widget: image}}
      - name: reseaux
        label: "Réseaux sociaux : téléphone avec le feed + carrousels"
        widget: object
        required: false
        fields:
          - {name: compte, label: "Nom du compte Instagram (sans @)", widget: string, required: false}
          - {name: avatar, label: Photo de profil du compte, widget: image, required: false}
          - {name: lien, label: Lien vers le compte Instagram, widget: string, required: false}
          - {name: feed, label: "Capture du feed (affichée dans le téléphone)", widget: image, required: false}
          - {name: legende_feed, label: Légende sous le téléphone, widget: string, required: false}
          - {name: carrousels, label: Carrousels, label_singular: carrousel, widget: list, required: false, collapsed: true, summary: "{{fields.titre}}", fields: [{name: titre, label: Titre, widget: string}, {name: texte, label: Petite phrase sous le carrousel, widget: string, required: false}, {name: slides, label: "Slides (dans l'ordre, format 4:5)", widget: list, field: {name: image, label: Slide, widget: image}}]}

# Toutes les images du site (affiches, photos, visuels…), pour que les cartes et l'onglet Médias les affichent
asset_collections:
  - name: images
    label: 🖼️ Images du site
    media_folder: images
    public_folder: /images

# Pages uniques (pas de cartes) : elles s'ouvrent directement depuis le menu
singletons:
  # ---------------------------------------------------------- AE2I
  - name: ae2i
    label: 💗 AE2I
    file: content/ae2i.json
    fields:
      - {name: titre, label: Grand titre, widget: string}
      - {name: sous_titre, label: Sous-titre manuscrit, widget: string, required: false}
      - {name: intro, label: Texte d'introduction, widget: text, required: false}
      - {name: instagram, label: Lien Instagram de l'asso, widget: string, required: false}
      - {name: logo, label: "Logo sans fond (imprimé sur le dossier du merch)", widget: image, required: false}
      - name: parcours
        label: Mes rôles dans l'asso
        label_singular: rôle
        widget: list
        collapsed: true
        required: false
        summary: "{{fields.titre}}"
        fields: [{name: titre, label: Rôle, widget: string}, {name: texte, label: Détail, widget: string}]
      - name: equipe
        label: L'équipe
        widget: object
        fields:
          - {name: titre, label: Titre, widget: string}
          - {name: sous_titre, label: Sous-titre manuscrit, widget: string, required: false}
          - {name: description, label: Description, widget: text, required: false}
          - {name: image, label: Photo d'équipe, widget: image}
      - name: identite
        label: Identité visuelle
        widget: object
        fields:
          - {name: titre, label: Titre, widget: string}
          - {name: sous_titre, label: Sous-titre manuscrit, widget: string, required: false}
          - {name: description, label: Description, widget: text, required: false}
          - {name: charte, label: Charte graphique, widget: image, required: false}
          - {name: logos, label: "Logos et déclinaisons (le premier est le grand)", widget: list, required: false, collapsed: true, thumbnail: image, summary: "{{fields.nom}}", hint: "Si le nom contient « Octobre rose », un petit ruban s'affiche.", fields: [{name: nom, label: Nom, widget: string}, {name: image, label: Image, widget: image}]}
      - name: reseaux
        label: Réseaux sociaux
        widget: object
        fields:
          - {name: titre, label: Titre, widget: string}
          - {name: sous_titre, label: Sous-titre manuscrit, widget: string, required: false}
          - {name: description, label: Description, widget: text, required: false}
          - {name: carrousel, label: "Slides du carrousel (dans l'ordre)", widget: list, required: false, collapsed: true, thumbnail: image, summary: "{{fields.nom}}", fields: [{name: nom, label: Nom de la slide, widget: string}, {name: image, label: "Image (format 4:5)", widget: image}]}
          - {name: feed, label: Capture du feed (téléphone), widget: image, required: false}
      - name: merch
        label: Le merch
        widget: object
        fields:
          - {name: titre, label: Titre, widget: string}
          - {name: sous_titre, label: Sous-titre manuscrit, widget: string, required: false}
          - {name: description, label: Description, widget: text, required: false}
          - {name: logo, label: "Logo d'événement (pastille ronde sur le dossier)", widget: image, required: false}
          - {name: logo_nom, label: Nom du logo, widget: string, required: false}
          - {name: pieces, label: "Vêtements détourés (PNG ou WebP sans fond), ils sortent du dossier en éventail", widget: list, required: false, collapsed: true, thumbnail: image, summary: "{{fields.nom}}", fields: [{name: nom, label: Nom, widget: string}, {name: image, label: Image sans fond, widget: image}]}
      - name: videos
        label: Vidéos de l'asso
        label_singular: vidéo
        widget: list
        collapsed: true
        thumbnail: miniature
        required: false
        summary: "{{fields.titre}}"
        hint: "Les vidéos se regardent directement sur le site, dans le lecteur. Colle le lien du réel Instagram (ou YouTube), ou envoie le fichier vidéo depuis ton ordinateur. La miniature est facultative : elle sert de vignette dans la liste."
        fields:
          - {name: titre, label: Titre, widget: string}
          - {name: genre, label: Type, widget: string, required: false, hint: "Ex. Aftermovie, Réel"}
          - {name: lien, label: Lien (YouTube ou Instagram), widget: string, required: false}
          - name: fichier
            label: "Fichier vidéo (envoyé depuis ton ordinateur)"
            widget: file
            required: false
            accept: "video/mp4,video/webm,.mp4,.webm"
            choose_url: false
            # GitHub refuse les gros fichiers et le site deviendrait lent : au-delà de 95 Mo (GitHub refuse plus de 100 Mo) l'admin bloque l'envoi
            # avec le message « Ce fichier ne peut pas être téléversé, car il dépasse la taille maximale ».
            media_libraries:
              default:
                config:
                  max_file_size: 99614720
            hint: "Pour une vidéo qui n'est pas sur YouTube ou Instagram. MP4, 95 Mo maximum (GitHub refuse les fichiers plus gros). Si ta vidéo est trop lourde, exporte-la en 1080p ou 720p. Si tu mets aussi un lien, c'est le fichier qui est lu sur le site."
          - {name: miniature, label: Miniature, widget: image, required: false}
          - {name: description, label: Description, widget: text, required: false}

  # ---------------------------------------------------------- PROFIL
  - name: profil
    label: 👤 Profil, à propos & contact
    file: content/profil.json
    fields:
      - {name: prenom, label: Prénom, widget: string}
      - {name: nom, label: Nom, widget: string}
      - {name: accroche, label: Phrase d'accueil, widget: text}
      - {name: photo_decoupe, label: "Photo détourée (accueil, PNG ou WebP transparent)", widget: image, required: false}
      - {name: photo_accueil, label: Petite photo de l'accueil, widget: image, required: false}
      - {name: photo_portrait, label: Portrait (À propos), widget: image, required: false}
      - {name: photo_contact, label: Photo du contact, widget: image, required: false}
      - name: cv
        label: "CV (PDF)"
        widget: file
        required: false
        accept: "application/pdf,.pdf"
        choose_url: false
        hint: "Ouvert par les boutons « Mon CV » de l'accueil et d'À propos. Laisse vide pour masquer ces boutons."
      - {name: bio, label: Biographie, widget: text}
      - {name: alternance, label: Encadré « recherche », widget: text, required: false, hint: "Laisse vide pour le masquer."}
      - name: parcours
        label: Parcours
        label_singular: étape
        widget: list
        collapsed: true
        summary: "{{fields.titre}}"
        fields:
          - {name: titre, label: Titre, widget: string}
          - {name: texte, label: Détail, widget: string, required: false}
      - name: distinctions
        label: Distinctions
        label_singular: distinction
        widget: list
        collapsed: true
        required: false
        summary: "{{fields.titre}}"
        fields:
          - {name: nom, label: Nom du prix, widget: string}
          - {name: titre, label: Catégorie, widget: string}
          - {name: detail, label: Détail, widget: string, required: false}
      - {name: competences, label: Compétences (bandeau défilant et À propos), widget: list, required: false}
      - {name: materiel, label: Mes outils, widget: list, required: false}
      - {name: email, label: E-mail, widget: string}
      - {name: telephone, label: Téléphone, widget: string, required: false}
      - {name: instagram, label: Lien Instagram, widget: string, required: false}
      - {name: youtube, label: Lien chaîne YouTube, widget: string, required: false}
      - name: options
        label: Options
        widget: object
        fields:
          - {name: youtube_integre, label: Lire les vidéos directement sur le site, widget: boolean, default: true}

  # ---------------------------------------------------------- SERVICES
  - name: services
    label: 🧾 Mes services
    file: content/services.json
    fields:
      - {name: titre, label: Grand titre, widget: string}
      - {name: sous_titre, label: Sous-titre manuscrit, widget: string, required: false}
      - {name: intro, label: Phrase d'introduction, widget: text, required: false}
      - name: services
        label: Services
        label_singular: service
        widget: list
        collapsed: true
        summary: "{{fields.titre}}"
        hint: "Chaque service a son bouton « Demander un devis », et apparaît dans le menu « Type de projet » du formulaire."
        fields:
          - {name: titre, label: Nom du service, widget: string}
          - {name: texte, label: Description, widget: text, required: false}
          - {name: inclus, label: "Ce qui est inclus (une ligne par élément)", widget: list, required: false}
          - {name: prix, label: Prix, widget: string, required: false, hint: "Ex. « À partir de 150 € ». Laisse vide pour ne pas afficher de prix."}

  # ---------------------------------------------------------- PAGES LÉGALES
  - name: legal
    label: ⚖️ Pages légales
    file: content/legal.json
    description: "Les informations des pages Mentions légales, CGV et Confidentialité (liens en bas du site). L'e-mail et le téléphone viennent de ton profil."
    fields:
      - {name: statut, label: Statut, widget: string, required: false, hint: "Ex. Micro-entrepreneuse"}
      - {name: siret, label: Numéro SIRET, widget: string, required: false, hint: "Laisse vide tant que tu n'en as pas : le site affichera « en cours d'immatriculation »."}
      - {name: adresse, label: Adresse professionnelle, widget: text, required: false, hint: "Obligatoire une fois immatriculée. Tu peux mettre une adresse de domiciliation."}
      - {name: tva, label: Mention TVA, widget: string, required: false, hint: "En micro-entreprise : « TVA non applicable, article 293 B du Code général des impôts. »"}
      - {name: mediateur, label: "Médiateur de la consommation (nom et site)", widget: string, required: false, hint: "Obligatoire si tu travailles pour des particuliers. Ex. CM2C, www.cm2c.net"}
      - {name: mis_a_jour, label: Date de mise à jour, widget: string, required: false}
